function toggleRun() {
    state.run = !state.run;
    if (!state.run) engineOff();
    lastFrameTime = performance.now();
    $('rb').textContent = state.run ? '⏸' : '▶';
    if (state.run)
        requestAnimationFrame(animationLoop);
}

function animationLoop(ts) {
    if (!state.run || state.tab != 2)
        return;
    let r = Math.min(.1, (ts - lastFrameTime) / 1000) * state.spd;
    lastFrameTime = ts;
    while (r > 0) {
        const d = Math.min(.04, r);
        stepSimulation(d);
        r -= d;
    }
    drawRace();
    if (state.sim.done) {
        state.run = false;
        $('rb').textContent = '🏁 Финиш';
        showResults();
        return;
    }
    requestAnimationFrame(animationLoop);
}

// Draws the map (camera, track, pit lane, racing lines, cars, mini-map) and refreshes tables and telemetry.
// ---- Car status HUD at the bottom of the map: tyres per wheel, speed and gear, pedals, ERS, fuel, damage ----
function drawHud(c, z, L) {
    const cv = $('hc'), W = cv.width = cv.clientWidth, H = cv.height = 100, g = cv.getContext('2d');
    const car = c.c, pf = trackProfile(state.tr), f1 = car.s == 'f1';
    g.fillStyle = 'rgba(11,13,18,.8)';
    g.fillRect(0, 0, W, H);
    g.fillStyle = '#e10600';
    g.fillRect(0, 0, W, 2);
    const wearColor = w => w < 60 ? '#2e9e4f' : w < 85 ? '#f0a020' : '#e53935';
    g.textAlign = 'center';
    // car seen from above; each wheel is coloured by its own wear (front tyres and the tyres loaded by the corners wear faster)
    g.save();
    g.translate(42, 54);
    g.fillStyle = c.out ? '#666' : teamColor(car);
    g.beginPath();
    g.moveTo(0, -32); g.lineTo(5, -14); g.lineTo(6, 20); g.lineTo(-6, 20); g.lineTo(-5, -14);
    g.closePath();
    g.fill();
    g.fillStyle = c.dg > 0 ? '#ff8f00' : '#d8d8d8';          // front wing turns orange when damaged
    g.fillRect(-16, -37, 32, 5);
    g.fillStyle = '#d8d8d8';
    g.fillRect(-12, 24, 24, 5);
    g.font = '700 8px system-ui';
    [[-18, -20, 1.1, 1], [6, -20, 1.1, -1], [-18, 12, .9, 1], [6, 12, .9, -1]].forEach(([x, y, k, side]) => {
        const w = clamp(c.wr * k * (1 + side * (pf.rs - .5) * .6), 0, 100);
        g.fillStyle = wearColor(w);
        g.fillRect(x, y, 12, 20);
        g.fillStyle = '#fff';
        g.fillText(Math.round(w), x + 6, y + 13);
    });
    g.restore();
    // speed, gear and status badge
    g.textAlign = 'left';
    g.fillStyle = '#fff';
    g.font = '700 30px system-ui';
    g.fillText(Math.round(c.v), 84, 44);
    g.font = '10px system-ui';
    g.fillStyle = '#9aa1ad';
    g.fillText('km/h', 86, 58);
    g.fillStyle = '#1b1f27';
    g.fillRect(84, 66, 26, 26);
    g.fillStyle = '#fff';
    g.font = '700 18px system-ui';
    g.textAlign = 'center';
    g.fillText(c.s < 0 && c.v < 3 ? 'N' : c.gr, 97, 85);
    const badge = c.out ? ['DNF', '#e53935'] : c.pit ? ['PIT', '#f0a020'] : c.req ? ['PIT REQ', '#f0a020'] : c.dr ? ['DRS', '#2e9e4f'] : null;
    if (badge) {
        g.font = '700 11px system-ui';
        g.fillStyle = badge[1];
        g.fillRect(114, 70, g.measureText(badge[0]).width + 10, 18);
        g.fillStyle = '#fff';
        g.fillText(badge[0], 114 + (g.measureText(badge[0]).width + 10) / 2, 83);
    }
    // pedals
    [[176, c.th, '#2e9e4f'], [190, c.br, '#e53935']].forEach(([x, v, col]) => {
        g.fillStyle = '#1b1f27';
        g.fillRect(x, 20, 10, 70);
        g.fillStyle = col;
        const h = 70 * clamp(v, 0, 100) / 100;
        g.fillRect(x, 90 - h, 10, h);
    });
    // horizontal bars: ERS, fuel, tyres
    const x0 = 214, bw = Math.min(360, W - x0 - 10);
    const bar = (y, label, frac, color, text) => {
        g.textAlign = 'left';
        g.font = '700 9px system-ui';
        g.fillStyle = '#9aa1ad';
        g.fillText(label, x0, y);
        g.textAlign = 'right';
        g.fillStyle = '#fff';
        g.fillText(text, x0 + bw, y);
        g.fillStyle = '#1b1f27';
        g.fillRect(x0, y + 3, bw, 8);
        g.fillStyle = color;
        g.fillRect(x0, y + 3, bw * clamp(frac, 0, 1), 8);
    };
    const fuel0 = startFuel(car, raceLaps()), fuelLeft = Math.max(0, fuel0 - fuelBurnPerLap(car) * Math.max(0, c.s) / L);
    if (f1) bar(18, 'ERS' + (c.dp ? ' ▶ DEPLOY' : ''), c.er / 100, c.dp ? '#4fc3f7' : '#1e88e5', Math.round(c.er) + '%');
    else bar(18, 'DAMAGE', c.dg > 0 ? .5 : 0, '#f0a020', c.dg > 0 ? '+' + c.dg.toFixed(1) + ' s/lap' : 'OK');
    bar(46, 'FUEL', fuelLeft / fuel0, '#ffb300', fuelLeft.toFixed(1) + ' kg');
    bar(74, 'TYRES ' + c.comp + ' · ' + c.age.toFixed(1) + ' laps', c.wr / 100, wearColor(c.wr), c.wr + '%');
    if (c.out) {
        g.fillStyle = 'rgba(11,13,18,.7)';
        g.fillRect(0, 0, W, H);
        g.textAlign = 'center';
        g.fillStyle = '#e53935';
        g.font = '700 22px system-ui';
        g.fillText('✖ DNF', W / 2, 44);
        g.font = '12px system-ui';
        g.fillStyle = '#fff';
        g.fillText(c.why, W / 2, 68);
    }
}

// ---- Broadcast overlay: lap counter in the top bar and the timing tower on the left ----
function updateBroadcast(ord, L) {
    const z = state.sim, N = raceLaps(), lead = ord[0], mode = state.gap;
    $('lapc').textContent = WEATHER_MODES[state.weather].icon + ' ' + (z.done ? '🏁 ФИНИШ' : 'КРУГ ' + Math.min(N, Math.max(1, lead.lp)) + '/' + N);
    const tower = $('tw'), sel = currentCar();
    // The rows are rebuilt only when the order, the selected car or the mode changes,
    // so taps on a row are not lost while the animation updates the numbers.
    const key = ord.map(c => c.c.id).join() + '|' + sel.id + '|' + mode;
    if (tower.dataset.key !== key) {
        tower.dataset.key = key;
        tower.innerHTML = `<div class="tw-h" onclick="toggleGapMode()">${mode == 'int' ? 'ИНТЕРВАЛ' : 'ОТРЫВ'}</div>` + ord.map((c, r) =>
            `<div class="tw-r${c.c === sel ? ' sel' : ''}" onclick="selectCar(${c.c.id})"><b>${r + 1}</b><i style="background:${teamColor(c.c)}"></i><span>${carShort(c.c)}</span><em></em><u></u></div>`).join('');
    }
    const rows = tower.querySelectorAll('.tw-r');
    ord.forEach((c, r) => {
        rows[r].children[3].textContent = c.out ? 'DNF' : c.fin ? '🏁' : c.pit ? 'ПИТ' : r ? gapText(c, mode == 'int' ? ord[r - 1] : lead, L) : 'ЛИДЕР';
        rows[r].children[4].textContent = c.comp;
        rows[r].children[4].style.color = TYRES[c.comp].c;
    });
}

function cycleSpeed() {
    state.spd = state.spd == 1 ? 5 : state.spd == 5 ? 20 : 1;
    $('spb').textContent = state.spd + '×';
}

function zoomMap(f) {
    state.z = clamp(state.z * f, .5, 4);
    drawRace();
}

function toggleCamera() {
    state.cam = !state.cam;
    state.kx = state.ky = state.ks = null;
    renderTestTab();
}

function toggleDnf() {
    state.dnf = !state.dnf;
    renderTestTab();
}

function toggleHuman() {
    state.human = !state.human;
    renderTestTab();
}

// "+0.842", "+12.4", "+1:04.2" or "+1 кр." (a lap or more behind), read from the timing loops.
function gapText(c, ref, L) {
    const laps = Math.floor((ref.s - c.s) / L + .02);
    if (laps >= 1) return '+' + laps + ' кр.';
    const d = gapSeconds(c, ref);
    return d == null ? '—' : '+' + formatGapTime(d);
}

function toggleGapMode() {
    state.gap = state.gap == 'int' ? 'gap' : 'int';
}

function selectCar(id) {
    state.a = state.cars.findIndex(c => c.id === id);
    render();
}

function drawRace() {
    const cv = $('tc');
    if (!cv || !state.sim)
        return;
    const z = state.sim;
    const pf = trackProfile(state.tr);
    const P = trackPath(state.tr);
    const L = pf.Lm;
    const N = P.length;
    const w = cv.width = cv.clientWidth;
    const h = cv.height = w < 700 ? Math.round(clamp(window.innerHeight * .6, 340, 620)) : Math.round(clamp(window.innerHeight * .64, 380, 780));
    const x = cv.getContext('2d');
    const fg = getComputedStyle(document.body).color;
    const sel = currentCar();
    const ord = raceOrder(z.cs);
    if (!pf.ppm) {
        let t = 0;
        P.forEach((q, i) => {
            const b = P[(i + 1) % N];
            t += Math.hypot(b[0] - q[0], b[1] - q[1]);
        });
        pf.ppm = t / L;
        const xs = P.map(p => p[0]);
        const ys = P.map(p => p[1]);
        pf.bb = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
    }
    const [bx, by, ex, ey] = pf.bb;
    const fit = Math.min((w - 30) / (ex - bx), (h - 150) / (ey - by));   // leave room for the status panel at the bottom
    const fc = z.cs.find(q => q.c === sel) || z.cs[0];
    // point and heading at a given distance along the lap
    const at = s => {
        const k = indexAtDistance(pf, s);
        const b = P[(k + 1) % N];
        const t = Math.min(1, Math.max(0, (((s % L) + L) % L - pf.D[k]) / pf.ds[k]));
        return [P[k][0] + (b[0] - P[k][0]) * t, P[k][1] + (b[1] - P[k][1]) * t, Math.atan2(b[1] - P[k][1], b[0] - P[k][0])];
    };
    // camera: follow the selected car or fit the whole track
    let tx;
    let ty;
    let ts;
    if (state.cam) {
        const f = at(fc.s);
        tx = f[0];
        ty = f[1];
        ts = Math.min(w, h) / (300 / state.z) / pf.ppm;
    }
    else {
        tx = (bx + ex) / 2;
        ts = fit;
        ty = (by + ey) / 2 + 55 / ts;                 // move the track up, away from the status panel
    }
    state.kx = state.kx == null ? tx : state.kx + (tx - state.kx) * .3;
    state.ky = state.ky == null ? ty : state.ky + (ty - state.ky) * .3;
    state.ks = state.ks == null ? ts : state.ks + (ts - state.ks) * .3;
    const sc = state.ks;
    const pt = q => [w / 2 + (q[0] - state.kx) * sc, h / 2 + (q[1] - state.ky) * sc];
    const pm = sc * pf.ppm;
    const rw = Math.max(14, Math.min(50, 14 * pm * 1.4));
    const po = (s, m) => {
        const f = at(s);
        const a = pt(f);
        return [a[0] - Math.sin(f[2]) * m * pm, a[1] + Math.cos(f[2]) * m * pm, f[2]];
    };
    const ln = a => {
        x.beginPath();
        a.forEach((q, i) => i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]));
    };
    const sm = v => {
        v = clamp(v, 0, 1);
        return v * v * (3 - 2 * v);
    };
    // ---- scenery and track surface ----
    x.fillStyle = ENVIRONMENT[state.tr].ground;
    x.fillRect(0, 0, w, h);
    const E = { i: state.tr, P, bb: pf.bb, ppm: pf.ppm, sc, cx: state.kx, cy: state.ky, w, h, pm };
    drawEnvironment(x, E);                         // sea, lakes, trees, buildings, landmarks
    const wetIdx = state.weather == 'dry' ? 0 : state.weather == 'damp' ? 1 : 2;
    x.lineJoin = 'round';
    x.lineCap = 'butt';
    const tr = () => {
        ln(P.map(pt));
        x.closePath();
    };
    const edge = ENVIRONMENT[state.tr].edge;
    x.strokeStyle = edge == 'ricard' ? '#3d6fcf' : edge == 'sand' ? 'rgba(214,190,130,.75)' : 'rgba(205,180,120,.55)';
    x.lineWidth = rw + 34;
    tr();
    x.stroke();
    if (edge == 'ricard') {                        // the blue and red run-off of Paul Ricard
        x.strokeStyle = '#d23c3c';
        x.setLineDash([rw * 2, rw * 2]);
        tr();
        x.stroke();
        x.setLineDash([]);
    }
    x.strokeStyle = '#e8e8e8';
    x.lineWidth = rw + 9;
    tr();
    x.stroke();
    x.strokeStyle = '#d32f2f';
    x.setLineDash([10, 10]);
    tr();
    x.stroke();
    x.setLineDash([]);
    x.strokeStyle = ['#3b3f45', '#33373d', '#2a2e34'][wetIdx];     // wet asphalt is darker
    x.lineWidth = rw;
    tr();
    x.stroke();
    if (wetIdx) {                                  // sheen of the water on the surface
        x.strokeStyle = 'rgba(190,210,235,.10)';
        x.lineWidth = rw * .55;
        tr();
        x.stroke();
    }
    x.strokeStyle = '#2e9e4f';
    x.lineWidth = Math.max(2, rw * .12);
    for (let k = 0; k < N; k++)
        if (pf.dr[k]) {
            const a = pt(P[k]);
            const b = pt(P[(k + 1) % N]);
            x.beginPath();
            x.moveTo(a[0], a[1]);
            x.lineTo(b[0], b[1]);
            x.stroke();
        }
    // питлейн
    drawStands(x, E, rw, at, po, L);
    // ---- pit lane and garages ----
    const pl = [];
    for (let s = L - 350; s <= L + 430; s += 10)
        pl.push(po(s, 22 * sm((s - (L - 350)) / 60) * sm((L + 430 - s) / 60)));
    x.strokeStyle = '#e8e8e8';
    x.lineWidth = Math.max(7, 11 * pm) + 3;
    ln(pl);
    x.stroke();
    x.strokeStyle = '#555a63';
    x.lineWidth = Math.max(7, 11 * pm);
    ln(pl);
    x.stroke();
    const bl = Math.max(6, 16 * pm);
    const bw = Math.max(5, 8 * pm);
    SERIES[sel.s].t.forEach((t, i) => {
        const p = po(L + 30 + i * 20, 31);
        x.save();
        x.translate(p[0], p[1]);
        x.rotate(p[2]);
        x.fillStyle = t[t.length - 1];
        x.fillRect(-bl / 2, -bw / 2, bl, bw);
        x.strokeStyle = '#fff';
        x.lineWidth = 1;
        x.strokeRect(-bl / 2, -bw / 2, bl, bw);
        x.restore();
    });
    x.font = 'bold 10px system-ui';
    x.textAlign = 'center';
    [['PIT IN', L - 350], ['PIT OUT', L + 430]].forEach(q => {
        const p = po(q[1], 36);
        x.lineWidth = 3;
        x.strokeStyle = '#000';
        x.strokeText(q[0], p[0], p[1]);
        x.fillStyle = '#fff';
        x.fillText(q[0], p[0], p[1]);
    });
    // линии: реальная (бледная) и оптимальная
    // ---- racing lines: optimal (yellow) and actual (faint) ----
    const rl = f => {
        const a = [];
        for (let k = 0; k < N; k += 2)
            a.push(po(pf.D[k], pf.off[k] * 6 * f));
        a.push(a[0]);
        ln(a);
        x.stroke();
    };
    x.strokeStyle = 'rgba(255,255,255,.3)';
    x.lineWidth = 2;
    rl(.55);
    x.strokeStyle = '#ffe600';
    x.lineWidth = 2.5;
    rl(1);
    const mk = (d, c) => {
        const f = at(d);
        const a = pt(f);
        const nx = -Math.sin(f[2]);
        const ny = Math.cos(f[2]);
        const r = rw / 2 + 5;
        x.strokeStyle = c;
        x.lineWidth = 4;
        x.beginPath();
        x.moveTo(a[0] + nx * r, a[1] + ny * r);
        x.lineTo(a[0] - nx * r, a[1] - ny * r);
        x.stroke();
    };
    mk(0, '#fff');
    mk(L / 3, '#ffd600');
    mk(2 * L / 3, '#2979ff');
    if (!pf.cn) {
        pf.cn = [];
        let c0 = 0;
        for (let k = 0; k < N; k++)
            if (pf.bp[k])
                pf.cn.push([pf.D[k], ++c0]);
    }
    x.font = 'bold 10px system-ui';
    x.textAlign = 'center';
    pf.cn.forEach(q => {
        mk(q[0], '#ff5252');
        const p = po(q[0] + 45, -(rw / 2 + 18) / pm);
        x.lineWidth = 3;
        x.strokeStyle = '#000';
        x.strokeText('T' + q[1], p[0], p[1]);
        x.fillStyle = '#fff';
        x.fillText('T' + q[1], p[0], p[1]);
    });
    x.textAlign = 'start';
    if (wetIdx) {                                  // grey light of a rainy sky
        x.fillStyle = wetIdx == 1 ? 'rgba(20,30,50,.10)' : 'rgba(10,20,40,.22)';
        x.fillRect(0, 0, w, h);
    }
    // ---- flat 2D car sprite (top view) ----
    const car = (px, py, an, co, big) => {
        x.save();
        x.translate(px, py);
        x.rotate(an);
        const k = big ? 1.3 : 1;
        x.scale(k, k);
        x.fillStyle = '#111';
        [[-9, -6.3], [-9, 3.6], [4, -6.3], [4, 3.6]].forEach(q => x.fillRect(q[0], q[1], 5.5, 2.7));
        x.fillStyle = co;
        x.fillRect(-13, -5.5, 3, 11);
        x.fillRect(10.5, -5.5, 3, 11);
        x.beginPath();
        x.moveTo(-11, -2.8);
        x.lineTo(3, -3.4);
        x.lineTo(11, -1);
        x.lineTo(11, 1);
        x.lineTo(3, 3.4);
        x.lineTo(-11, 2.8);
        x.closePath();
        x.fill();
        x.strokeStyle = '#000';
        x.lineWidth = .8;
        x.stroke();
        x.fillStyle = '#fff';
        x.beginPath();
        x.arc(-1, 0, 1.9, 0, 6.283);
        x.fill();
        x.restore();
    };
    // lateral offset of a car: racing line, grid slot, overtake manoeuvre, pit lane
    const latOf = c => {
        const k = indexAtDistance(pf, c.s);
        let m = pf.off[k] * 6 * c.lw + c.lo;
        if (c.s < 150)
            m += (c.c.grid % 2 ? 1 : -1) * 6 * clamp(1 - c.s / 150, 0, 1);
        if (c.pit) {
            const b = sm(clamp((c.s - c.ei) / 60, 0, 1) * clamp((c.ex - c.s) / 60, 0, 1));
            m = m * (1 - b) + 22 * b;
        }
        return m;
    };
    for (const c of z.cs.slice().sort((a, b) => (a.c === sel) - (b.c === sel))) {
        const a = po(c.s, latOf(c));
        const isS = c.c === sel;
        if (isS) {
            x.strokeStyle = fg;
            x.lineWidth = 2;
            x.beginPath();
            x.arc(a[0], a[1], 21, 0, 6.283);
            x.stroke();
        }
        x.globalAlpha = c.out ? .45 : 1;
        car(a[0], a[1], a[2], teamColor(c.c), isS);
        x.font = 'bold 11px system-ui';
        const t2 = (c.out ? '✖' : ord.indexOf(c) + 1) + ' ' + carShort(c.c);
        x.lineWidth = 3;
        x.strokeStyle = '#000';
        x.strokeText(t2, a[0], a[1] - 17);
        x.fillStyle = '#fff';
        x.fillText(t2, a[0], a[1] - 17);
        x.globalAlpha = 1;
    }
    x.textAlign = 'start';
    if (wetIdx) {                                  // rain streaks
        x.strokeStyle = 'rgba(205,225,255,.4)';
        x.lineWidth = 1;
        x.beginPath();
        for (let q = wetIdx == 1 ? 40 : 160; q > 0; q--) {
            const rx = Math.random() * w, ry = Math.random() * h;
            x.moveTo(rx, ry);
            x.lineTo(rx - 4, ry + 12);
        }
        x.stroke();
    }
    // ---- mini-map ----
    if (state.cam) {
        const mw = 112;
        const mh = 92;
        const m0 = w - mw - 8;
        const mm = Math.min((mw - 12) / (ex - bx), (mh - 12) / (ey - by));
        const q = p => [m0 + 6 + (p[0] - bx) * mm, 14 + (p[1] - by) * mm];
        x.fillStyle = 'rgba(0,0,0,.6)';
        x.fillRect(m0, 8, mw, mh);
        x.strokeStyle = '#ddd';
        x.lineWidth = 2;
        ln(P.map(q));
        x.closePath();
        x.stroke();
        z.cs.forEach(c => {
            const a = q(at(c.s));
            x.fillStyle = teamColor(c.c);
            x.beginPath();
            x.arc(a[0], a[1], c.c === sel ? 4.5 : 3, 0, 6.283);
            x.fill();
        });
    }
    // ---- standings, overtake log and telemetry panel ----
    $('lv').innerHTML = ord.map((c, r) => `<tr${c.c === sel ? ' style="font-weight:700"' : ''}><td>${r + 1}</td><td><span style="color:${teamColor(c.c)}">●</span> ${carLabel(c.c)}${c.pit ? ' 🅿' : ''}${c.fin ? ' 🏁' : ''}${c.out ? ' ✖ DNF' : ''}${c.dr ? ' <b style="color:#2e9e4f">DRS</b>' : ''}</td><td>${r && !c.out ? gapText(c, ord[0], L) : '—'}</td><td>${r && !c.out ? gapText(c, ord[r - 1], L) : '—'}</td><td>${Math.round(c.v)}</td><td><b style="color:${TYRES[c.comp].c};text-shadow:0 0 1px #000">${c.comp}</b> ${c.wr}%</td><td>${Math.max(0, c.lp)}</td></tr>`).join('');
    $('lg').innerHTML = z.log.map(s => '🔁 ' + s).join('<br>');
    updateBroadcast(ord, L);
    const c = z.cs.find(q => q.c === sel);
    if (!c)
        return;
    const r = ord.indexOf(c);
    $('tgp').innerHTML = r ? `<b>P${r + 1}</b> · отставание от ${carLabel(ord[r - 1].c)}: <b>${gapText(c, ord[r - 1], L)} с</b>` : `<b>P1 · лидер</b>${ord[1] ? ` · интервал до ${carLabel(ord[1].c)}: <b>${gapText(ord[1], c, L)} с</b>` : ''}`;
    const pt2 = z.t - c.pin;
    $('tpt').innerHTML = c.pit === 1 ? `🅿 Питлейн (лимит 80 км/ч): <b>${pt2.toFixed(2)} с</b>` : c.pit === 2 ? `🛠 Стоянка в боксах: <b>${c.stC.toFixed(2)} с</b> · питлейн ${pt2.toFixed(2)} с` : c.pit === 3 ? `Выезд из боксов · питлейн <b>${pt2.toFixed(2)} с</b>` : `Последний пит-стоп: питлейн <b>${c.pl ? c.pl.toFixed(2) : '—'} с</b> · стоянка <b>${c.stT ? c.stT.toFixed(2) : '—'} с</b>${c.req ? ' · заявка на заезд ✔' : ''}`;
    $('pitb').className = c.req ? 'on' : '';
    drawHud(c, z, L);
    if (state.run && !z.done) updateEngineSound(c);
    else engineOff();
    const c3 = [0, 1, 2].map(j => j < c.sec ? c.sc[j] : j == c.sec ? z.t - c.st : 0);
    $('tsc').innerHTML = `Круг ${Math.max(0, c.lp)}: <b>${c.lp > 0 ? formatTime(z.t - c.ts) : '—'}</b><br>Сейчас: С1 ${formatSector(c3[0])} · С2 ${formatSector(c3[1])} · С3 ${formatSector(c3[2])}<br>Прошлый: С1 ${formatSector(c.ls[0])} · С2 ${formatSector(c.ls[1])} · С3 ${formatSector(c.ls[2])} · круг ${c.last ? formatTime(c.last) : '—'}<br>Лучший круг: ${c.best ? formatTime(c.best) : '—'}`;
    // ---- speed trace chart ----
    const sp = $('sp');
    const sw = sp.width = sp.clientWidth;
    const sh = sp.height = 100;
    const y = sp.getContext('2d');
    const vm = pf.vt * 1.05;
    y.strokeStyle = fg;
    y.lineWidth = 2;
    y.beginPath();
    for (let k = 0; k < pf.n; k += 2) {
        const X = pf.D[k] / L * sw;
        const Y = sh - 4 - pf.u[k] * 3.6 * c.m / vm * (sh - 8);
        k ? y.lineTo(X, Y) : y.moveTo(X, Y);
    }
    y.stroke();
    y.strokeStyle = '#ffd600';
    y.beginPath();
    y.moveTo(sw / 3, 0);
    y.lineTo(sw / 3, sh);
    y.moveTo(2 * sw / 3, 0);
    y.lineTo(2 * sw / 3, sh);
    y.stroke();
    const cp = ((c.s % L + L) % L) / L * sw;
    y.strokeStyle = '#e10600';
    y.beginPath();
    y.moveTo(cp, 0);
    y.lineTo(cp, sh);
    y.stroke();
    y.fillStyle = '#e10600';
    y.beginPath();
    y.arc(cp, sh - 4 - c.v / vm * (sh - 8), 4, 0, 6.283);
    y.fill();
    // retired car: show the reason instead of the pit information
    const retired = z.cs.find(q => q.c === sel);
    if (retired && retired.out) $('tpt').textContent = '✖ ' + retired.why;
}

/**
 * Race results window with per-car analysis.
 */

// Classification: finishers by laps and finishing time plus steward penalties, then retired cars by distance covered.
function classified(z) {
    const finished = [...z.res].sort((a, b) => (b.lp - a.lp) || ((a.fin + a.pen) - (b.fin + b.pen)));
    return [...finished, ...[...z.dnf].sort((a, b) => b.s - a.s)];
}

function showResults() {
    const z = state.sim;
    let d = $('rs');
    if (!d) {
        d = document.createElement('div');
        d.id = 'rs';
        d.style.cssText = 'position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--fg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 80px';
        document.body.appendChild(d);
    }
    const rs = classified(z);
    const w = rs[0];
    d.innerHTML = `<div style="max-width:860px;margin:0 auto"><div class="row" style="align-items:center"><h2 style="margin:0;flex:4;font-size:18px">🏁 Итоги · ${TRACKS[state.tr][TRACK.NAME]} · ${raceLaps()} кр.</h2><button onclick="$('rs').remove()">✕ Закрыть</button></div>
<div class="card"><table><tr><th>#</th><th>Болид</th><th>Время / отрыв</th><th>Лучший</th><th>Пит</th><th>Обг.</th></tr>${rs.map((c, i) => `<tr><td>${i + 1}</td><td><span style="color:${teamColor(c.c)}">●</span> ${carLabel(c.c)}</td><td>${c.out ? 'DNF · ' + c.why : (i ? (c.lp < w.lp ? '+' + (w.lp - c.lp) + ' кр.' : '+' + ((c.fin + c.pen) - (w.fin + w.pen)).toFixed(3)) : formatTime(w.fin + w.pen)) + (c.pen ? ' (⚖️ +' + c.pen + ' с)' : '')}</td><td>${c.best ? formatTime(c.best) : '—'}</td><td>${c.ps.length}</td><td>${c.ot}/${c.lost}</td></tr>`).join('')}</table><div class="mu">Обг.: совершено / потеряно позиций</div></div>
<div class="card"><h3>Анализ болида</h3><select id="ra" style="width:100%" onchange="showCarAnalysis(+this.value)">${optionsHtml(rs.map(c => carLabel(c.c)), 0)}</select><div id="rb2"></div></div></div>`;
    showCarAnalysis(0);
}

function showCarAnalysis(i) {
    const z = state.sim;
    const c = classified(z)[i];
    const w = z.res[0] || c;
    const tr = TRACKS[state.tr];
    const hl = c.hl;
    const fg = getComputedStyle(document.body).color;
    const srt = [...hl].sort((a, b) => a - b);
    const med = srt[srt.length >> 1] || 1;
    const mean = a => a.length ? a.reduce((p, q) => p + q, 0) / a.length : 0;
    const cln = a => {
        const m = [...a].sort((x, y) => x - y)[a.length >> 1] || 1;
        return a.filter((t, j) => j > 0 && t < m * 1.03);
    };
    const cc = cln(hl);
    const k3 = Math.max(1, Math.floor(cc.length / 3));
    const dg = mean(cc.slice(-k3)) - mean(cc.slice(0, k3));
    const g = c.c.grid + 1;
    const pos = i + 1;
    const bi = hl.indexOf(Math.min(...hl)) + 1;
    const av = (c.fin ? (c.lp - 1) * tr[TRACK.LENGTH_KM] : c.s / 1000) / (c.fin || c.outT) * 3600;
    const ins = [`Старт P${g} → финиш P${pos}: ${pos < g ? '+' + (g - pos) + ' мест' : pos > g ? '−' + (pos - g) + ' мест' : 'без изменений'}; обгонов совершено ${c.ot}, позиций потеряно ${c.lost}.`,
        `Темп: лучший круг ${formatTime(c.best)} (круг ${bi}); ${i ? 'в среднем ' + (mean(cc) - mean(cln(w.hl))).toFixed(2) + ' с/кр. к лидеру.' : 'лучший средний темп среди финишировавших.'}`,
        `Шины: к концу стинтов темп меняется на ${dg > 0 ? '+' : ''}${dg.toFixed(2)} с/кр.; ${c.ps.length ? c.ps.map((p, j) => `стоп ${j + 1} на круге ${p.lap - 1} (износ ${p.w}%, далее ${TYRES[p.comp].n})`).join('; ') : 'пит-стопов не было'}.`,
        `Режим: полный газ ${(c.tf / c.tt * 100).toFixed(0)}% времени, торможение ${(c.tb / c.tt * 100).toFixed(0)}%, DRS ${c.td.toFixed(0)} с, макс. скорость ${Math.round(c.vx)} км/ч, средняя ${av.toFixed(0)} км/ч.`,
        c.c.s == 'f1' ? `ERS: потрачено ${c.eu.toFixed(0)}% заряда, рекуперировано ${c.eh.toFixed(0)}%, в конце ${Math.round(c.er)}%.` : 'У F2 нет ERS.'];
    if (state.human) {
        const eff = effectivePilot(c.c);
        ins.push(`Реалистичная езда: ошибок ${c.errN}, потери ≈ ${c.errT.toFixed(1)} с; разброс темпа ±${c.sd.toFixed(2)} с.`);
        if (c.c.traits.length) ins.push('Черты: ' + c.c.traits.map(id => TRAITS[id].name).join(', ') + '.');
        ins.push(`Пилот: RTG ${pilotRating(effectivePilot(c.c))} (EXP ${eff.exp} · RAC ${eff.rac} · AWA ${eff.awa} · PAC ${eff.pac})${c.pen ? '; штрафы стюардов +' + c.pen + ' с' : ''}.`);
    }
    if (c.out) ins.unshift(`✖ Сход на круге ${Math.max(1, c.lp)}: ${c.why}.`);
    $('rb2').innerHTML = `<ul style="padding-left:18px;margin:8px 0">${ins.map(t => '<li>' + t + '</li>').join('')}</ul><div class="mu">Время круга (пики пит-стопов обрезаны), фон — шины</div><canvas id="rc1" style="height:150px"></canvas><div class="mu">Позиция по кругам</div><canvas id="rc2" style="height:120px"></canvas>${c.ps.length ? `<table><tr><th>Стоп</th><th>Круг</th><th>Питлейн</th><th>Стоянка</th><th>Шины</th></tr>${c.ps.map((p, j) => `<tr><td>${j + 1}</td><td>${p.lap - 1}</td><td>${p.pl.toFixed(2)} с</td><td>${p.st.toFixed(2)} с</td><td>${TYRES[p.comp].n}</td></tr>`).join('')}</table>` : ''}`;
    const n = Math.max(1, hl.length);
    const a = $('rc1');
    const W = a.width = a.clientWidth;
    const H = a.height = 150;
    const x = a.getContext('2d');
    const mn = Math.min(...hl);
    const mx = Math.max(mn + 1, med * 1.03);
    hl.forEach((t, j) => {
        x.globalAlpha = .3;
        x.fillStyle = TYRES[c.hc[j] || 'M'].c;
        x.fillRect(j / n * W, 0, W / n, H);
    });
    x.globalAlpha = 1;
    x.strokeStyle = fg;
    x.lineWidth = 2;
    x.beginPath();
    hl.forEach((t, j) => {
        const X = (j + .5) / n * W;
        const Y = H - 8 - (Math.min(t, mx) - mn) / (mx - mn) * (H - 16);
        j ? x.lineTo(X, Y) : x.moveTo(X, Y);
    });
    x.stroke();
    const b = $('rc2');
    const y = b.getContext('2d');
    const W2 = b.width = b.clientWidth;
    const H2 = b.height = 120;
    const nc = Math.max(2, z.cs.length);
    y.strokeStyle = '#e10600';
    y.lineWidth = 2;
    y.beginPath();
    c.hp.forEach((p, j) => {
        const X = (j + .5) / n * W2;
        const Y = 8 + (p - 1) / (nc - 1) * (H2 - 16);
        j ? y.lineTo(X, Y) : y.moveTo(X, Y);
    });
    y.stroke();
    y.fillStyle = fg;
    y.font = '10px system-ui';
    y.fillText('P1', 2, 10);
    y.fillText('P' + nc, 2, H2 - 2);
}

/**
 * "Pilots" tab: character creation. A pilot has a name, four ratings (EXP, RAC, AWA, PAC) and up to three traits.
 * Created pilots are kept in a library (localStorage; memory only if the browser blocks storage) and can be seated
 * in a car from this tab or from the car tab. Seating copies the pilot into the car, so later edits of the library
 * do not change cars that are already set up.
 */
const PILOTS_KEY = 'f1-engineer-pilots';
let pilotFallback = [];
let pilotMessage = '';

function loadPilots() {
    try {
        return JSON.parse(localStorage.getItem(PILOTS_KEY)) || [];
    } catch (e) {
        return pilotFallback;
    }
}

function storePilots(list) {
    pilotFallback = list;
    try {
        localStorage.setItem(PILOTS_KEY, JSON.stringify(list));
    } catch (e) { /* memory only */ }
}

const pilotById = id => loadPilots().find(p => p.id == id);
const newDraft = () => ({ id: 0, name: '', pil: { ...PILOT_DEFAULT }, traits: [] });
const draft = () => state.draft || (state.draft = newDraft());
const cleanTraits = ids => [...new Set(ids.filter(id => TRAITS[id]))].slice(0, MAX_TRAITS);

// Seats a library pilot in a car. The car keeps its own name when keepName is true and it has one.
function seatPilot(car, p, keepName) {
    if (!(keepName && car.name) && p.name) car.name = p.name;
    car.pil = { ...p.pil };
    car.traits = cleanTraits(p.traits);
}

const traitChips = ids => ids.length ? ids.map(id => `<span class="tchip" title="${TRAITS[id].desc}">${TRAITS[id].name}</span>`).join('') : '<span class="mu">Нет черт</span>';

const pilotOptions = selected => '<option value="">Стандартный пилот (70)</option>' + loadPilots().map(p => `<option value="${p.id}"${p.id == selected ? ' selected' : ''}>${p.name} · RTG ${pilotRating(p.pil)}</option>`).join('');

// Short pilot summary with a selector, shown in the car card of the car tab.
function pilotSummaryHtml(car) {
    const p = effectivePilot(car);
    return `<div class="pilot"><div class="rtg"><b>${pilotRating(p)}</b><small>RTG</small></div><div class="pst"><div class="mu">EXP ${p.exp} · RAC ${p.rac} · AWA ${p.awa} · PAC ${p.pac}</div><div>${traitChips(car.traits || [])}</div></div></div>
<div class="row" style="margin-bottom:4px"><select id="cpl">${pilotOptions('')}</select><button onclick="seatSelectedPilot()">Посадить пилота</button></div>
<div class="mu" style="margin-bottom:8px">Пилотов создают во вкладке «Пилоты».</div>`;
}

function seatSelectedPilot() {
    const p = pilotById($('cpl').value);

function setTraitSlot(k, id) {
    const d = draft(), t = [...d.traits];
    t[k] = id || undefined;
    d.traits = cleanTraits(t);
    renderPilotsTab();
}

function savePilot() {
    const d = draft(), list = loadPilots();
    const p = { id: d.id || Date.now(), name: cleanName(d.name) || 'Пилот', pil: { ...d.pil }, traits: cleanTraits(d.traits) };
    d.id = p.id;
    d.name = p.name;
    storePilots(list.some(x => x.id == p.id) ? list.map(x => x.id == p.id ? p : x) : [...list, p]);
    pilotMessage = 'Пилот сохранён: ' + p.name;
    renderPilotsTab();
}

function newPilot() {
    state.draft = newDraft();
    renderPilotsTab();
}

function editPilot(id) {
    const p = pilotById(id);
    if (!p) return;
    state.draft = { id: p.id, name: p.name, pil: { ...p.pil }, traits: cleanTraits(p.traits) };
    renderPilotsTab();
    window.scrollTo(0, 0);
}

function deletePilot(id) {
    const p = pilotById(id);
    if (!p) return;
    storePilots(loadPilots().filter(x => x.id != id));
    if (draft().id == id) draft().id = 0;
    pilotMessage = 'Пилот удалён: ' + p.name;
    renderPilotsTab();
}

// Seats the library pilot in the selected car (chips at the top choose the car).
function seatLibraryPilot(id) {
    const p = pilotById(id), car = state.cars[state.a];
    pilotMessage = car ? p.name + ' — посажен в болид ' : 'Нет болидов — сначала добавьте болид во вкладке «Болид».';
    if (car) {
        seatPilot(car, p, false);
        pilotMessage += carLabel(car);

    render();
}

/**
 * Sound, synthesised with the Web Audio API (no sound files).
 *   - the engine note of the selected car while the race runs (pitch from speed and gear, loudness from the throttle)
 *   - short cues for overtakes, pit stops, crashes, failures and the finish
 * state.volume (0-100, settings menu) is the master volume. Browsers start audio only after a click or tap,
 * so initAudio() is called from the first pointer event (see main.js).
 */
const sound = { ctx: null, master: null, filter: null, engine: null, osc: [] };

// Speed ranges of the gears in km/h; the engine revs up inside a gear and drops at the shift.
const GEAR_LIMITS = {
    f1: [0, 70, 105, 145, 185, 225, 265, 300, 345],
    f2: [0, 60, 100, 150, 200, 250, 310],
};

const volumeGain = () => Math.pow(state.volume / 100, 2) * .9;

function applyVolume() {
    if (sound.master) sound.master.gain.setTargetAtTime(volumeGain(), sound.ctx.currentTime, .03);
}

function initAudio() {
    if (sound.ctx) {
        if (sound.ctx.state === 'suspended') sound.ctx.resume();
        return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = sound.ctx = new AC();
    sound.master = ctx.createGain();
    sound.master.connect(ctx.destination);
    sound.filter = ctx.createBiquadFilter();
    sound.filter.type = 'lowpass';
    sound.engine = ctx.createGain();
    sound.engine.gain.value = 0;
    sound.filter.connect(sound.engine);
    sound.engine.connect(sound.master);
    // two slightly detuned saw waves and a square wave an octave up: a rough turbo V6 buzz
    sound.osc = [['sawtooth', 1, .5], ['sawtooth', 1.006, .4], ['square', 2, .12]].map(([type, ratio, level]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type;
        o.frequency.value = 200;
        g.gain.value = level;
        o.connect(g);
        g.connect(sound.filter);
        o.start();
        return { o, ratio };
    });
    applyVolume();
}

// c = simulated car (state.sim.cs[i]) that the player follows
function updateEngineSound(c) {
    if (!sound.ctx) return;
    if (c.out || state.volume == 0) return engineOff();
    const lim = GEAR_LIMITS[c.c.s == 'f1' ? 'f1' : 'f2'];
    const g = clamp(c.gr, 1, lim.length - 1);
    const ratio = clamp((c.v - lim[g - 1]) / (lim[g] - lim[g - 1]), 0, 1);
    const idle = c.v < 5;
    const rpm = idle ? 3800 : c.c.s == 'f1' ? 6500 + ratio * 6500 : 5500 + ratio * 4000;
    const f = rpm / 60 * 3 * .6;                 // a V6 fires three times per revolution; scaled down to a pleasant pitch
    const t = sound.ctx.currentTime;
    sound.osc.forEach(({ o, ratio }) => o.frequency.setTargetAtTime(f * ratio, t, .05));
    sound.filter.frequency.setTargetAtTime(500 + c.th * 22 + ratio * 300, t, .08);
    sound.engine.gain.setTargetAtTime(idle ? .05 : .08 + .18 * c.th / 100, t, .08);
}

function engineOff() {
    if (sound.engine) sound.engine.gain.setTargetAtTime(0, sound.ctx.currentTime, .1);
}

function tone(freq, dur, type = 'sine', level = .3, delay = 0) {
    const ctx = sound.ctx, t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(level, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g);
    g.connect(sound.master);
    o.start(t);
    o.stop(t + dur + .02);
}

function noise(dur, level) {
    const ctx = sound.ctx, n = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass';
    f.frequency.value = 1200;
    g.gain.value = level;
    src.buffer = buf;
    src.connect(f);
    f.connect(g);
    g.connect(sound.master);
    src.start();
}

// Race event cues. car = garage car the event is about; most cues play only for the selected car.
function playEvent(kind, car) {
    if (!sound.ctx || state.volume == 0) return;
    const own = !car || car === currentCar();
    if (kind === 'overtake' && own) {
        tone(660, .12, 'triangle');
        tone(880, .2, 'triangle', .3, .1);
    }
    else if (kind === 'lost' && own) {
        tone(330, .15, 'sawtooth', .18);
        tone(247, .22, 'sawtooth', .18, .12);
    }
    else if (kind === 'pit' && own) {
        tone(520, .08, 'square', .12);
        tone(520, .08, 'square', .12, .14);
    }
    else if (kind === 'crash') noise(.7, own ? .6 : .25);
    else if (kind === 'fail' && own) tone(220, .6, 'sawtooth', .25);
    else if (kind === 'finish' && own) [523, 659, 784, 1047].forEach((f, i) => tone(f, .5, 'triangle', .25, i * .12));
    else if (kind === 'preview') tone(440, .1, 'triangle', .3);
}

/**
 * Settings menu: theme, language and volume. The values are kept in localStorage, so they survive a reload.
 * (Theme: setTheme() in main.js, language: setLang() in i18n.js, sound: audio.js.)
 */
const SETTINGS_KEY = 'f1-engineer-settings';

function loadSettings() {
    try {
        return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
    } catch (e) {
        return {};
    }
}

function saveSettings() {
    try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({ theme: state.theme, lang: state.lang, volume: state.volume }));
    } catch (e) { /* storage blocked: settings last until the page is closed */ }
}

function openSettings() {
    $('set').classList.add('open');
}

function closeSettings() {
    $('set').classList.remove('open');
}

function setVolume(v) {
    state.volume = v;
    $('svol').value = v;
    $('svv').textContent = v;
    applyVolume();
    saveSettings();
}

// Slider moved by the user: also wakes up the audio engine (browsers need a user gesture for that).
function onVolumeInput(v) {
    setVolume(v);
    initAudio();
}

/**
 * Russian -> English translation. The UI is written in Russian; in English mode every text node is translated
 * through EN_DICTIONARY (longest phrase first). Add new UI texts to js/data/dictionary.js.
 */

// Longest phrases first so that long sentences win over the words inside them.
const EN_DICTIONARY = DICTIONARY_PAIRS.slice().sort((a, b) => b[0].length - a[0].length);

// Cache of already translated strings.
const translationCache = new Map();

function translate(d) {
    let r = translationCache.get(d);
    if (r != null)
        return r;
    r = d;
    for (const [a, b] of EN_DICTIONARY)
        if (r.includes(a))
            r = r.split(a).join(b);
    r = r.replace(/(\d+)\s*кр\.:/g, 'Lap $1:').replace(/(\d)\s*кр\./g, '$1 laps').replace(/(\d|\)|—)\s*с(?![А-Яа-яЁё])/g, '$1 s').replace(/(\d)\s*кг/g, '$1 kg');
    if (translationCache.size > 3000)
        translationCache.clear();
    translationCache.set(d, r);
    return r;
}

function translateTextNode(n) {
    if (state.lang !== 'en')
        return;
    const d = n.data;
    if (!/[А-Яа-яЁё]/.test(d))
        return;
    if (n.__ru == null)
        n.__ru = d;
    const e = translate(n.__ru === d ? d : d);
    if (e !== d)
        n.data = e;
}

function translateTree(r) {
    if (state.lang !== 'en')
        return;
    if (r.nodeType === 3)
        return translateTextNode(r);
    const w = document.createTreeWalker(r, 4);
    let n;
    while (n = w.nextNode())
        translateTextNode(n);
}

new MutationObserver(m => {
    if (state.lang !== 'en')
        return;
    for (const x of m) {
        if (x.type === 'characterData')
            translateTextNode(x.target);
        else
            x.addedNodes.forEach(translateTree);
    }
}).observe(document.body, { childList: true, subtree: true, characterData: true });

function setLang(l) {
    state.lang = l;
    document.documentElement.lang = l;
    $('sl').value = l;
    $('slng').value = l;
    if (l == 'en') {
        translateTree(document.body);
        document.title = 'F1 2020 — Race Engineer';
    }
    else {
        const w = document.createTreeWalker(document.body, 4);
        let n;
        while (n = w.nextNode())
            if (n.__ru != null)
                n.data = n.__ru;
        document.title = 'F1 2020 — Инженер-стратег';
    }
    saveSettings();
    if (state.cars.length)
        render();
}

/**
 * Start-up code: theme, start screen and initial state. Loaded last.
 */

applyTyreAllocation();

$('trk').innerHTML = optionsHtml(TRACKS.map(track => track[TRACK.NAME]), 0);

function setTheme(v) {
    const r = document.documentElement;
    if (v == 'sys')
        r.removeAttribute('data-theme');
    else
        r.setAttribute('data-theme', v == 'white' ? 'light' : 'dark');
    state.theme = v;
    $('sth').value = v;
    $('sthm').value = v;
    saveSettings();
    if (state.sim && state.tab == 2)
        drawRace();
}

function startApp() {
    document.body.classList.remove('st');
    $('st').style.display = 'none';
    render();
}

state.lang = 'ru';

// Restore the saved settings; without them the browser language decides.
const saved = loadSettings();
setVolume(saved.volume != null ? saved.volume : state.volume);
setTheme(saved.theme || 'sys');
const startLang = saved.lang || ((navigator.language || 'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en');
if (startLang == 'en') setLang('en');

// Browsers allow sound only after a click or tap.
document.addEventListener('pointerdown', initAudio, { passive: true });

state.cars.push(makeCar('f1', 0), makeCar('f1', 9));

state.cars.forEach((c, i) => c.grid = i);

switchTab(0);
</script>
</body>
