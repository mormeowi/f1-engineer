<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>F1 2020 — Инженер-стратег</title>
    <style>
/* F1 2020 Race Engineer - styles. Colours are CSS variables on :root; the dark theme redefines them. */

:root {
  --bg:#f2f3f6;
  --fg:#14161b;
  --cd:#fff;
  --mu:#6b7280;
  --ln:#dfe2e8;
  --ac:#e10600;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}

@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg:#0e1014;
    --fg:#eceef2;
    --cd:#181b22;
    --mu:#9aa1ad;
    --ln:#2a2e38;
    color-scheme:dark;
  }
}

:root[data-theme="dark"] {
  --bg:#0e1014;
  --fg:#eceef2;
  --cd:#181b22;
  --mu:#9aa1ad;
  --ln:#2a2e38;
  color-scheme:dark;
}

html {
  scroll-padding-top:env(safe-area-inset-top,0px);
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:70px;
}

body::before {
  content:"";
  position:fixed;
  inset:0 0 auto;
  height:env(safe-area-inset-top,0px);
  background:var(--cd);
  z-index:10;
}

header {
  position:sticky;
  top:env(safe-area-inset-top,0px);
  background:var(--cd);
  border-bottom:2px solid var(--ac);
  padding:8px 12px;
  z-index:9;
}

h1 {
  font-size:17px;
  margin:0 0 6px;
}

h3 {
  margin:0 0 8px;
  font-size:15px;
}

main,#chips {
  max-width:860px;
  margin:0 auto;
  padding:10px 12px;
}

#chips {
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:0;
}

.row {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.row>* {
  flex:1;
}

select,button {
  font:inherit;
  color:var(--fg);
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:10px;
  padding:8px 10px;
  min-height:38px;
}

button {
  cursor:pointer;
}

button.on,.chip.on {
  background:var(--ac);
  color:#fff;
  border-color:var(--ac);
}

button.pr {
  background:var(--ac);
  color:#fff;
  border-color:var(--ac);
  font-weight:600;
}

.chip {
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:6px;
  flex:none;
  padding:6px 10px;
  min-height:34px;
}

.chip i {
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
}

.card {
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
}

.seg {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.seg>button {
  flex:1;
  padding:6px;
}

.sl {
  display:grid;
  grid-template-columns:1fr auto;
  margin:6px 0;
  font-size:13px;
}

.sl input {
  grid-column:1/3;
  width:100%;
  accent-color:var(--ac);
}

.sl b {
  font-variant-numeric:tabular-nums;
}

.g {
  color:var(--mu);
  font-size:12px;
  text-transform:uppercase;
  margin:12px 0 2px;
  letter-spacing:.05em;
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  font-variant-numeric:tabular-nums;
}

td,th {
  padding:5px 3px;
  border-bottom:1px solid var(--ln);
  text-align:left;
}

canvas {
  width:100%;
  display:block;
  border-radius:10px;
  background:var(--bg);
}

.mu {
  color:var(--mu);
  font-size:13px;
}

.bad {
  color:var(--ac);
  font-weight:600;
}

nav {
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  background:var(--cd);
  border-top:1px solid var(--ln);
  padding-bottom:env(safe-area-inset-bottom,0px);
  z-index:9;
}

nav button {
  flex:1;
  border:0;
  border-radius:0;
  min-height:52px;
  background:none;
}

nav button.on {
  background:none;
  color:var(--ac);
  font-weight:700;
  border-top:3px solid var(--ac);
}

.big {
  font-size:26px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
}

.bar {
  height:12px;
  background:var(--ln);
  border-radius:6px;
  overflow:hidden;
  margin-bottom:4px;
}

.bar i {
  display:block;
  height:100%;
  width:0;
}

#st {
  position:fixed;
  inset:0;
  z-index:50;
  background:radial-gradient(circle at 50% 30%,var(--cd),var(--bg));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
}

#st h1 {
  font-size:34px;
  margin:6px 0 2px;
}

#st .sub {
  color:var(--mu);
  margin-bottom:28px;
}

#st .go {
  font-size:20px;
  padding:14px 56px;
  border-radius:14px;
}

#st .lang {
  margin-top:22px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--mu);
}

#wm {
  position:fixed;
  right:8px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 58px);
  z-index:60;
  font-size:11px;
  color:var(--mu);
  pointer-events:none;
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:8px;
  padding:3px 8px;
  opacity:.92;
}

#wm a {
  color:var(--ac);
  pointer-events:auto;
  text-decoration:none;
  font-weight:600;
}

body.st #wm {
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
}

.spotify {
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-top:16px;
  padding:11px 26px;
  border-radius:500px;
  background:#1db954;
  color:#000;
  font-weight:700;
  font-size:15px;
  letter-spacing:.2px;
  text-decoration:none;
  box-shadow:0 4px 14px rgba(29,185,84,.35);
  transition:transform .12s,background .12s;
}

.spotify:hover {
  background:#1ed760;
  transform:scale(1.04);
}

.spotify:active {
  transform:scale(.98);
}

.spotify svg {
  width:22px;
  height:22px;
  flex:none;
}

/* ---- Race tab: wide layout, broadcast frame, timing tower ---- */
#ti {
  max-width: 860px;
  margin: 0 auto;
  padding: 6px 12px 0;
}

body.wide main,
body.wide #chips,
body.wide #ti {
  max-width: 1500px;
}

input[type=text] {
  font: inherit;
  color: var(--fg);
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: 10px;
  padding: 8px 10px;
  min-height: 38px;
  width: 100%;
}

.stage {
  position: relative;
  margin: 0 -12px 10px;
  background: #0b0d12;
  border-top: 3px solid #e10600;
  overflow: hidden;
}

@media (min-width: 760px) {
  .stage {
    margin: 0 0 10px;
    border: 2px solid #1c2028;
    border-top: 3px solid #e10600;
    border-radius: 14px;
  }
}

.bcast {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 12px;
  background: linear-gradient(90deg, #14171e, #0b0d12);
  color: #fff;
  font: 700 13px/1 system-ui, sans-serif;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.bcast .live b {
  background: #e10600;
  padding: 3px 7px;
  border-radius: 4px;
  margin-right: 8px;
}

.stage canvas {
  border-radius: 0;
  background: #0b0d12;
}

.tower {
  position: absolute;
  left: 8px;
  top: 8px;
  width: 140px;
  color: #fff;
  font: 600 11px/1 system-ui, sans-serif;
  background: rgba(11, 13, 18, .82);
  border-radius: 8px;
  overflow: hidden;
}

.tw-h {
  padding: 5px 8px;
  font-size: 9px;
  letter-spacing: .1em;
  color: #9aa1ad;
  background: rgba(255, 255, 255, .06);
  cursor: pointer;
}

.tw-r {
  display: grid;
  grid-template-columns: 16px 4px 1fr auto 12px;
  gap: 6px;
  align-items: center;
  padding: 4px 8px;
  cursor: pointer;
}

.tw-r.sel {
  background: rgba(225, 6, 0, .55);
}

.tw-r i {
  display: block;
  width: 4px;
  height: 14px;
  border-radius: 2px;
}

.tw-r b {
  text-align: right;
}

.tw-r em {
  font-style: normal;
  color: #e8e8e8;
  font-variant-numeric: tabular-nums;
}

.tw-r u {
  text-decoration: none;
  font-size: 10px;
}

/* ---- Race tab: compact controls inside the frame, status HUD on the map ---- */
.view {
  position: relative;
}

.hud {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 100px;
  pointer-events: none;
  background: transparent !important;
}

.tools {
  display: flex;
  gap: 4px;
  padding: 6px;
  background: #0b0d12;
}

/* all buttons share the width, so nothing needs scrolling on a phone */
.tools button {
  flex: 1 1 0;
  min-width: 0;
  max-width: 90px;
  min-height: 34px;
  padding: 4px 2px;
  font-size: 15px;
  white-space: nowrap;
  color: #fff;
  background: #1b1f27;
  border: 1px solid #2a2f3a;
}

.tools button.on,
.tools button.pr {
  background: #e10600;
  border-color: #e10600;
}

/* less chrome above the map on the race tab */
body.wide header {
  position: static;
  padding: 6px 12px;
}

body.wide header h1,
body.wide #ti,
body.wide #eqb {
  display: none;
}

body.wide header select,
body.wide header button {
  min-height: 32px;
  padding: 4px 8px;
  font-size: 13px;
}

/* ---- Pilot card ---- */
.pilot {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 6px 0;
  padding: 8px 10px;
  background: var(--bg);
  border: 1px solid var(--ln);
  border-radius: 12px;
}

.rtg {
  flex: none;
  width: 58px;
  padding: 6px 0;
  text-align: center;
  color: #fff;
  background: #e10600;
  border-radius: 10px;
}

.rtg b {
  display: block;
  font-size: 26px;
  line-height: 1;
}

.rtg small {
  font-size: 10px;
  letter-spacing: .1em;
}

.pst {
  flex: 1;
}

.pst label {
  display: grid;
  grid-template-columns: 34px 1fr 26px;
  align-items: center;
  gap: 6px;
  margin: 2px 0;
  font-size: 11px;
  font-weight: 700;
}

.pst input {
  height: 18px;
  margin: 0;
  accent-color: var(--ac);
}

.pst b {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* ---- Settings menu ---- */
.gear {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  right: 12px;
  padding: 6px 12px;
  font-size: 20px;
  border-radius: 12px;
}

#set {
  position: fixed;
  inset: 0;
  z-index: 70;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, .5);
}

#set.open {
  display: flex;
}

.sheet {
  width: 100%;
  max-width: 380px;
  padding: 14px 16px;
  color: var(--fg);
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: 16px;
}

.sh-h {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.srow {
  display: grid;
  grid-template-columns: 90px 1fr auto;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
}

.srow select {
  grid-column: 2 / 4;
}

.srow input[type=range] {
  accent-color: var(--ac);
}

/* ---- Pilots tab ---- */
.tchip {
  display: inline-block;
  margin: 3px 3px 0 0;
  padding: 2px 8px;
  font-size: 11px;
  background: var(--bg);
  border: 1px solid var(--ln);
  border-radius: 999px;
}

.trait {
  margin: 6px 0;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--ln);
  border-radius: 10px;
  font-size: 12px;
}

.trait ul {
  margin: 4px 0 0;
  padding-left: 18px;
}

.prow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--ln);
}

.pbtn {
  display: flex;
  flex: none;
  gap: 4px;
}

.pbtn button {
  padding: 4px 8px;
  min-height: 34px;
  font-size: 13px;
}

nav button {
  font-size: 13px;
}
</style>
</head>
<body class="st">

<!-- Top bar: track, power mode, theme, language -->
<header>
    <h1>🏎️ F1 2020 · Инженер-стратег</h1>
    <div class="row">
        <select id="trk" onchange="state.tr=+this.value;render()"></select>
        <button id="eqb" onclick="state.eq=!state.eq;render()"></button>
        <button id="setb" onclick="openSettings()" style="flex:0 0 auto">⚙️</button>
    </div>
</header>

<!-- Car chips, track facts and the active tab are rendered into these three containers -->
<div id="chips"></div>
<div id="ti" class="mu"></div>
<main id="m"></main>

<nav>
    <button onclick="switchTab(0)">🔧 Болид</button>
    <button onclick="switchTab(1)">📊 Стратегия</button>
    <button onclick="switchTab(2)">⏱️ Тест</button>
    <button onclick="switchTab(3)">👤 Пилоты</button>
</nav>

<!-- Start screen -->
<div id="st">
    <div style="font-size:64px">🏎️</div>
    <h1>F1 2020</h1>
    <div class="sub">Инженер-стратег</div>
    <button class="gear" onclick="openSettings()">⚙️</button>
    <button class="pr go" onclick="startApp()">Начать</button>
    <a class="spotify" href="https://open.spotify.com/playlist/6NShZO3L4vNwC0VX8GzDp1?si=9W0B8rEhSrSBn7LOVs0Uhw&amp;utm_source=copy-link&amp;pi=WIhhPJ_0SsCqB" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="12" fill="#000"/>
            <path d="M5.5 9c4.5-1.3 9-.9 13 1.4M6.5 12.6c3.6-1 7-.7 10 1.1M7.6 15.8c2.7-.7 5.2-.5 7.4.8" stroke="#1db954" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </svg>
        <span>Мой гоночный плейлист</span>
    </a>
    <div class="lang"><span>Язык</span>
        <select id="sl" onchange="setLang(this.value)">
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
    </div>
    <div class="lang"><span>Тема</span>
        <select id="sth" onchange="setTheme(this.value)">
            <option value="sys">Как в системе</option>
            <option value="white">Белая</option>
            <option value="black">Чёрная</option>
        </select>
    </div>
</div>

<!-- Settings menu -->
<div id="set" onclick="if (event.target === this) closeSettings()">
    <div class="sheet">
        <div class="sh-h"><b>⚙️ Настройки</b><button onclick="closeSettings()">✕</button></div>
        <label class="srow"><span>Тема</span>
            <select id="sthm" onchange="setTheme(this.value)">
                <option value="sys">Как в системе</option>
                <option value="white">Белая</option>
                <option value="black">Чёрная</option>
            </select>
        </label>
        <label class="srow"><span>Язык</span>
            <select id="slng" onchange="setLang(this.value)">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
        </label>
        <label class="srow"><span>Громкость</span>
            <input type="range" id="svol" min="0" max="100" value="60" oninput="onVolumeInput(+this.value)" onchange="playEvent('preview')">
            <b id="svv">60</b>
        </label>
        <div class="mu">Звук: двигатель выбранного болида и сигналы событий гонки (обгон, пит-стоп, авария, финиш).</div>
    </div>
</div>

<div id="wm">Made with Claude · by mormeowi · <a href="https://github.com/mormeowi" target="_blank" rel="noopener">GitHub: mormeowi</a></div>

<!-- Scripts: plain scripts (no modules) so the page also works when opened from disk. Order matters. -->
<script>
/**
 * Small helpers shared by every module.
 */

const $ = id => document.getElementById(id);

const hashString = s => {
    let h = 2166136261;
    for (const c of s) {
        h ^= c.charCodeAt(0);
        h = Math.imul(h, 16777619);
    }
    return (h >>> 0) / 4294967296;
};

const formatTime = t => {
    const h = Math.floor(t / 3600);
    const m = Math.floor(t % 3600 / 60);
    const s = t % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + s.toFixed(3).padStart(6, '0');
};

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const formatSector = t => t ? t.toFixed(3) : '—';

// Roughly normal random number (mean 0, standard deviation 1).
const gauss = () => (Math.random() + Math.random() + Math.random() + Math.random() - 2) * 1.73;

// Gap text like on a timing screen: 0.842 / 12.4 / 1:04.2
const formatGapTime = d => d < 10 ? d.toFixed(3) : d < 60 ? d.toFixed(1) : Math.floor(d / 60) + ':' + (d % 60).toFixed(1).padStart(4, '0');

/**
 * Global application state. Everything the UI shows is derived from this object.
 * 
 * state fields
 *   cars   list of cars in the garage (see makeCar in model/cars.js)
 *   a      index of the active car (the chip that is highlighted)
 *   tr     index of the selected track in TRACKS
 *   eq     true = "equal power" mode: team performance values are ignored
 *   pct    race distance in percent (25 / 35 / 50 / 100)
 *   tab    active tab: 0 car, 1 strategy, 2 test
 *   spd    simulation speed multiplier in the test tab
 *   run    true while the race animation is running
 *   human  true = realistic driving: lap-to-lap pace noise, mistakes, slow starts and pit stops
 *   dnf    true = crashes, contact, damage and technical failures can happen (retirements)
 *   gap    timing tower mode: 'int' = interval to the car ahead, 'gap' = gap to the leader
 *   cam    true = camera follows the selected car, false = whole track
 *   z      camera zoom factor
 *   lang   'ru' or 'en'
 *   draft  pilot being edited in the Pilots tab
 *   weather 'dry' | 'damp' | 'rain' (model/weather.js)
 *   theme  'sys' | 'white' | 'black'
 *   volume master volume 0-100 (settings menu)
 *   sim    current race simulation (created by initSimulation), see simulation.js
 *   key    signature of the last simulation inputs; the simulation restarts when it changes
 */

const state = {
    cars: [], a: 0, tr: 0, eq: false, pct: 100, tab: 0, tc: 'S', fuel: 10, spd: 5, run: false, tm: 0, cam: true,
    theme: 'sys',
    weather: 'dry',
    volume: 60,
    human: false,
    dnf: false,
    gap: 'int', z: 1
};

let nextCarId = 0;
let lastFrameTime = 0;

/**
 * The 22 circuits of F1 2020. TRACKS[i][TRACK.xxx] is used all over the code; index i is the track number
 * (the same index is used by TRACK_GEOMETRY and TYRE_ALLOCATION).
 *
 * To tune a track edit its row:
 *   LAP_TIME       reference race-pace lap time in seconds (a clean lap of a mid-grid F1 car)
 *   PIT_LOSS       time lost for a pit-lane drive-through without stopping, seconds
 *   TYRE_WEAR      tyre wear factor (1 = average, higher = tyres die sooner)
 *   FULL_THROTTLE  share of the lap at full throttle, % (decides how important engine power is)
 *   DOWNFORCE      required downforce level 1-5 (decides the ideal wing settings)
 *   OVERTAKING     1 = very hard to overtake ... 5 = easy
 */
const TRACK = {
    NAME: 0,
    LENGTH_KM: 1,
    LAPS: 2,
    LAP_TIME: 3,
    PIT_LOSS: 4,
    TYRE_WEAR: 5,
    FULL_THROTTLE: 6,
    DOWNFORCE: 7,
    CORNERS: 8,
    DRS_ZONES: 9,
    OVERTAKING: 10,
};

//                 name, km, laps, lap time, pit loss, tyre wear, full throttle %, downforce, corners, DRS, overtaking
const TRACKS = [
    ['Австралия', 5.303, 58, 80, 21, 0.8, 66, 3, 14, 2, 3],
    ['Бахрейн', 5.412, 57, 93, 23, 1.3, 70, 3, 15, 3, 4],
    ['Вьетнам', 5.607, 55, 91.5, 22, 0.9, 72, 2, 23, 3, 4],
    ['Китай', 5.451, 56, 96, 22, 1.15, 63, 3, 16, 2, 4],

/**
 * Pilot ratings, 1-99, like the stats on a driver card:
 *   EXP  experience     RAC  racecraft     AWA  awareness     PAC  pace
 *   RTG  overall rating, calculated from the four (pace counts the most; rookies with low EXP lose a little).
 * The ratings change the driving only while "realistic driving" is on - see driverTraits() in simulation.js.
 */
const PILOT_STATS = [
    // [key, short code, name]
    ['exp', 'EXP', 'Опыт (Experience)'],
    ['rac', 'RAC', 'Гоночное мастерство (Racecraft)'],
    ['awa', 'AWA', 'Осознанность (Awareness)'],
    ['pac', 'PAC', 'Скорость (Pace)'],
];

// 70 everywhere: all pilots are about equal until you change the ratings.
const PILOT_DEFAULT = { exp: 70, rac: 70, awa: 70, pac: 70 };

const pilotRating = p => Math.round(.4 * p.pac + .25 * p.rac + .2 * p.awa + .15 * p.exp);

/**
 * Trait effects (see data/traits.js for the texts).
 *
 * effectivePilot(car)   ratings after the traits (the rookie trait pins EXP to 1 and lifts the other three)
 * applyTraits(c, weak)  sets the multipliers of a simulated car c; weak = its car is among the slowest of the field
 *
 * Multipliers used by the simulation (all 1 = no effect):
 *   bigMul      share of big mistakes among the mistakes
 *   mistakeMul  chance of a mistake     crashMul  chance that a big mistake ends in a retirement
 *   contactMul  chance of a contact     wetRisk   extra factor for mistakes and contacts in damp/rain
 *   atkMul      success of own attacks  defMul    success of rivals attacking this car
 *   nearMul     pressure term of the mistake chance (a rival close behind)
 * The pace effects are added to c.pz (seconds per lap, negative = faster) and c.sd (pace scatter).
 */
const hasTrait = (car, id) => (car.traits || []).includes(id);

function effectivePilot(car) {
    const p = { ...car.pil };
    if (hasTrait(car, 'rookie')) {
        p.exp = 1;
        p.rac = Math.min(99, p.rac + 8);
        p.awa = Math.min(99, p.awa + 8);
        p.pac = Math.min(99, p.pac + 8);
    }
    return p;
}

function applyTraits(c, weak) {
    const car = c.c, k = TRACKS[state.tr][TRACK.LAP_TIME] / 90;        // seconds scale with the lap time
    const wetLoss = weatherLoss(state.tr) * TRACKS[state.tr][TRACK.LAP_TIME];   // seconds per lap lost to the weather
    const wet = state.weather == 'rain' ? 1 : state.weather == 'damp' ? .5 : 0;
    if (hasTrait(car, 'adaptive')) {
        c.pz -= wetLoss * .03;
        c.wetRisk *= .8;
        c.sd *= .85;
        if (!wet) c.pz += .05 * k;
    }
    if (hasTrait(car, 'rainMaster')) {
        c.pz -= (wetLoss * .04 + .1 * k) * wet;
        c.wetRisk *= 1 - .3 * wet;
        if (!wet) {
            c.pz += .12 * k;
            c.sd *= 1.05;
        }
    }
    if (hasTrait(car, 'rookie')) {
        c.mistakeMul *= 1.5;
        c.crashMul *= 1.5;
        c.bigMul *= 3;
        c.contactMul *= 1.35;
        c.pz -= .06 * k;
    }
    if (hasTrait(car, 'underdog')) {
        if (weak) {
            c.pz -= .7 * k;
            c.mistakeMul *= .75;
            c.atkMul *= 1.2;
        } else c.pz += .05 * k;
    }
    if (hasTrait(car, 'clumsyPass')) {
        c.atkMul *= .65;
        c.defMul *= .6;
        c.nearMul *= .75;
        c.contactMul *= 1.2;
    }
}

/**
 * Cars in the garage.
 * 
 * A car object (makeCar):
 *   id     unique id            s     series key: 'f1' | 'f2' | 'f19'
 *   name   optional name given by the user (shown in tables, chips and the timing tower)
 *   traits pilot traits (ids from data/traits.js, at most MAX_TRAITS)
 *   pil    pilot ratings {exp, rac, awa, pac} 1-99 (see model/pilot.js); only used while realistic driving is on
 *   t      team index in SERIES[s].t
 *   st     [power unit, aero, chassis, reliability] 0-100
 *   su     setup values, keyed by SETUP_PARAMS[i][0]
 *   grid   starting position, 0 = pole
 *   str    race strategy: c = compounds per stint ('S'|'M'|'H'), f = pit laps as fractions of the race,
 *          fm = fuel mix (L|S|R|X), er = ERS mode (N|M|O|H), fl = start fuel in kg (null = automatic)
 */

const teamStats = (s, i) => {
    const t = SERIES[s].t[i];
    return s == 'f1' ? t.slice(1, 5) : [80, t[1], t[1], t[1]];
};

const teamColor = c => {
    const t = SERIES[c.s].t[c.t];
    return t[t.length - 1];
};

// Label used in chips and tables: the given name plus the team, or series + team when there is no name.
const carLabel = c => c.name ? `${c.name} (${SERIES[c.s].t[c.t][0]})` : SERIES[c.s].s + ' ' + SERIES[c.s].t[c.t][0];

// Three-letter code for the map and the timing tower.
const carShort = c => (c.name || SERIES[c.s].t[c.t][0]).replace(/\s+/g, '').slice(0, 3).toUpperCase();

// Names are inserted into HTML, so strip the characters that could break it.
const cleanName = v => v.replace(/[<>&"']/g, '').trim().slice(0, 14);

const makeCar = (s, i, name = '', pil = null) => ({
    id: ++nextCarId, name, pil: { ...PILOT_DEFAULT, ...pil }, traits: [], s, t: i, st: teamStats(s, i), su: Object.fromEntries(SETUP_PARAMS.map(d => [d[0], d[5]])), str: {
        c: ['M', 'H'], f: [.45 + (Math.random() - .5) * .12],   // default one-stop plan; the pit lap differs a little from car to car
         fm: 'S', er: 'M', fl: null
    }
});

const currentCar = () => state.cars[state.a];

const horsepower = c => c.s == 'f1' ? Math.round(760 + 2.5 * effectiveStats(c)[0]) : 620;

const effectiveStats = c => state.eq ? [80, 80, 80, 80] : c.st;

const normalizeGrid = () => [...state.cars].sort((a, b) => a.grid - b.grid).forEach((c, i) => c.grid = i);

/**
 * Weather model. state.weather is 'dry', 'damp' or 'rain' (data in data/weather.js).
 * It changes the lap time, tyre choice and wear, grip (corner speeds), risk of mistakes and contacts,
 * DRS (off in rain) and the spray that makes following harder.
 */
const weatherMode = () => WEATHER_MODES[state.weather];
const weatherLoss = i => state.weather == 'dry' ? 0 : WEATHER_TRACK[i][state.weather == 'damp' ? 0 : 1] / 100;
const weatherRisk = i => state.weather == 'dry' ? 1 : weatherMode().risk * WEATHER_TRACK[i][2];
const weatherGrip = () => weatherMode().grip;
const weatherTyreOffset = m => COMPOUND_WEATHER_OFFSET[state.weather][m];
const weatherTyreWear = m => COMPOUND_WEATHER_WEAR[state.weather][m] || 1;

function weatherNote(i) {
    if (state.weather == 'dry') return 'Сухая трасса: полный темп, шины Софт/Медиум/Хард.';
    const t = WEATHER_TRACK[i], loss = t[state.weather == 'damp' ? 0 : 1], risk = weatherRisk(i).toFixed(1);
    return state.weather == 'damp'
        ? `Сыро: темп −${loss}%, риск ошибок ×${risk}, лучше Интер; ${t[3]}.`
        : `Дождь: темп −${loss}%, риск ошибок ×${risk}, DRS выключен, нужны дождевые шины; ${t[3]}.`;
}

// Put a car's strategy on tyres that fit the weather (teams would do the same when the weather changes).
function adaptStrategy(c) {
    const w = state.weather;
    c.str.c = c.str.c.map(m => w == 'dry' ? (m == 'I' || m == 'W' ? 'M' : m) : w == 'damp' ? 'I' : 'W');
    if (w == 'dry' && new Set(c.str.c).size < 2) c.str.c[c.str.c.length - 1] = 'H';
}

function setWeather(w) {
    state.weather = w;
    state.cars.forEach(adaptStrategy);
    render();
}

function cycleWeather() {
    setWeather({ dry: 'damp', damp: 'rain', rain: 'dry' }[state.weather]);
}

/**
 * Lap time, tyre wear and fuel model.
 * 
 * Lap time = track reference time * series factor * (1 + performance deficit)
 *            + setup penalty + tyre loss + fuel effect + fuel-mix / ERS-mode delta.
 * simulateRace() sums that over the whole race for a given strategy and is what the strategy tab uses.
 */

const powerWeight = i => Math.min(.46, Math.max(.2, .2 + (TRACKS[i][TRACK.FULL_THROTTLE] - 40) * .0065));

function applyTyreAllocation() {
    const a = TYRE_ALLOCATION[state.tr];
    ['H', 'M', 'S'].forEach((k, j) => {
        const n = a[j];
        TYRES[k].d = TYRE_DEGRADATION[n - 1];
        TYRES[k].l = TYRE_LIFE[n - 1];
        TYRES[k].o = (a[2] - n) * .55;
        TYRES[k].n = ({ S: 'Софт', M: 'Медиум', H: 'Хард' })[k] + ' (C' + n + ')';
    });
}

const raceLaps = () => Math.max(3, Math.round(TRACKS[state.tr][TRACK.LAPS] * state.pct / 100));

// Setup values that trade lap time against tyre wear (camber, toe, tyre pressure).
const TYRE_SETUP_KEYS = ['fc', 'rc', 'ft', 'rt', 'pfl', 'pfr', 'prl', 'prr'];

const setupAggression = c => {
    const n = k => {
        const d = SETUP_PARAMS.find(x => x[0] == k);
        return (c.su[k] - d[2]) / (d[3] - d[2]);
    };
    return ((1 - n('fc')) + (1 - n('rc')) + n('ft') + n('rt') + (1 - n('pfl')) + (1 - n('pfr')) + (1 - n('prl')) + (1 - n('prr'))) / 8;
};

const tyreWearFactor = c => .85 + .35 * setupAggression(c);

const idealSetupValue = (d, i) => {
    const k = d[0];
    if (k == 'fw')
        return clamp(Math.round(TRACKS[i][TRACK.DOWNFORCE] * 2 - 1) + weatherMode().wing, 0, 11);
    if (k == 'rw')
        return clamp(Math.round(TRACKS[i][TRACK.DOWNFORCE] * 2.4 - .5) + weatherMode().wing, 0, 11);
    if (TYRE_SETUP_KEYS.includes(k)) {
        const a = clamp(.7 - (TRACKS[i][TRACK.TYRE_WEAR] - 1) * .8, .15, .9);
        const m = (k == 'ft' || k == 'rt') ? a : 1 - a;
        return d[2] + (d[3] - d[2]) * m;
    }
    return clamp(d[5] + (hashString(TRACKS[i][TRACK.NAME] + k) - .5) * .3 * (d[3] - d[2]), d[2], d[3]);
};

// Lap time lost to a poor setup (0 = ideal for this track).
function setupPenalty(c, i) {
    let s = 0;
    for (const d of SETUP_PARAMS)
        if (!TYRE_SETUP_KEYS.includes(d[0]))
            s += Math.abs(c.su[d[0]] - idealSetupValue(d, i)) / (d[3] - d[2]);
    return (s * .7 + (1 - setupAggression(c)) * .7) * TRACKS[i][TRACK.LAP_TIME] / 90;
}

function baseLapTime(c, i) {
    const w = powerWeight(i);
    const e = effectiveStats(c);
    const sc = e[0] * w + e[1] * (.8 - w) + e[2] * .2;
    return TRACKS[i][TRACK.LAP_TIME] * SERIES[c.s].k * (1 + (100 - sc) * SERIES[c.s].d) * (1 + weatherLoss(i)) + setupPenalty(c, i);
}

const tyreTimeLoss = (k, m, tr, w = 1) => {
    const p = TYRES[m];
    const tw = tr[TRACK.TYRE_WEAR] * w * weatherTyreWear(m);
    const L = p.l / tw;
    return (p.o + weatherTyreOffset(m) + p.d * tw * k + (k > L ? (k - L) * .12 : 0)) * tr[TRACK.LAP_TIME] / 90;
};

// Fuel mix and ERS mode as in the game: pace delta (s per 90 s lap) and fuel burn.
const FUEL_MIX_BURN = {
    L: .93, S: 1, R: 1.06, X: 1.14
};
const FUEL_MIX_PACE = {
    L: .3, S: 0, R: -.18, X: -.3
};
const ERS_MODE_PACE = {
    N: .8, M: 0, O: -.2, H: -.35
};

const fuelMix = c => c.str.fm || 'S';
const ersMode = c => c.s == 'f1' ? (c.str.er || 'M') : 'M';
const fuelBurnPerLap = c => TRACKS[state.tr][TRACK.LENGTH_KM] * (c.s == 'f1' ? .34 : .27) * FUEL_MIX_BURN[fuelMix(c)];
const startFuel = (c, N) => c.str.fl != null ? c.str.fl : Math.min(SERIES[c.s].x, N * fuelBurnPerLap(c) + 1.5);
const modePaceDelta = (c, tr) => (FUEL_MIX_PACE[fuelMix(c)] + (c.s == 'f1' ? ERS_MODE_PACE[ersMode(c)] : 0)) * tr[TRACK.LAP_TIME] / 90;

function simulateRace(b, tr, N, cs, p, c) {
    const F = startFuel(c, N);
    const br = fuelBurnPerLap(c);
    const w = tyreWearFactor(c);
    const d = modePaceDelta(c, tr);
    let t = 0;
    let si = 0;
    let k = 0;
    const l = [];
    for (let i = 0; i < N; i++) {
        let x = b + d + tyreTimeLoss(k++, cs[si], tr, w) + Math.max(0, F - br * i) * .03 + (i ? 0 : 3 + c.grid * .15 * (6 - tr[TRACK.OVERTAKING]) / 3);
        if (si < p.length && i + 1 == p[si]) {
            x += tr[TRACK.PIT_LOSS];
            si++;
            k = 0;
        }
        l.push(x);
        t += x;
    }
    return { l, t, fr: F - br * N };
}

const pitLaps = (c, N) => c.str.f.map(f => clamp(Math.round(f * N), 3, N - 3));

/**
 * Track geometry and speed profile.
 * 
 * trackPath(i)     smooth closed outline of track i (from TRACK_GEOMETRY)
 * trackProfile(i)  per-point corner speed limit, acceleration/braking pass, DRS zones, braking points,
 *                  ERS deployment zones and the optimal racing-line offset
 */

const pathCache = {};

function trackPath(i) {
    if (pathCache[i])
        return pathCache[i];
    const [lat, pts] = TRACK_GEOMETRY[i].split('|');
    const k = Math.cos(+lat * Math.PI / 180);
    const P = pts.split(' ').map(s => {
        const [x, y] = s.split(',').map(Number);
        return [x * k, -y];
    });
    const n = P.length;
    const o = [];
    for (let k = 0; k < n; k++) {
        const a = P[(k + n - 1) % n];
        const b = P[k];
        const c = P[(k + 1) % n];
        const d = P[(k + 2) % n];
        for (let t = 0; t < 20; t++) {
            const u = t / 20;
            const u2 = u * u;
            const u3 = u2 * u;
            o.push([0, 1].map(z => .5 * (2 * b[z] + (-a[z] + c[z]) * u + (2 * a[z] - 5 * b[z] + 4 * c[z] - d[z]) * u2 + (-a[z] + 3 * b[z] - 3 * c[z] + d[z]) * u3)));
        }
    }
    return pathCache[i] = o;
}

// профиль скорости: кривизна -> предел скорости, разгон/торможение, зоны DRS и точки торможения
const profileCache = {};

// Speed limits from curvature, forward/backward passes, DRS zones, braking points, ERS zones, racing line.
function trackProfile(i) {
    const key = i + state.weather;                 // the profile depends on the grip of the weather
    if (profileCache[key])
        return profileCache[key];
    const grip = weatherGrip();
    const P = trackPath(i);
    const n = P.length;
    const tr = TRACKS[i];
    const Lm = tr[TRACK.LENGTH_KM] * 1000;
    const sg = [];
    let tot = 0;
    for (let k = 0; k < n; k++) {
        const a = P[k];
        const b = P[(k + 1) % n];
        const d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1e-9;
        sg.push(d);
        tot += d;
    }
    const ds = sg.map(d => d / tot * Lm);
    const D = [0];
    ds.forEach((d, k) => D.push(D[k] + d));
    // top speed from the full-throttle share
    const vt = 240 + (tr[TRACK.FULL_THROTTLE] - 40) * 2.25;
    const u = [];
    for (let k = 0; k < n; k++) {
        const a = P[(k + n - 1) % n];
        const b = P[k];
        const c = P[(k + 1) % n];
        const g = Math.atan2(c[1] - b[1], c[0] - b[0]) - Math.atan2(b[1] - a[1], b[0] - a[0]);
        const an = Math.abs(Math.atan2(Math.sin(g), Math.cos(g)));
        const cu = an / ((ds[(k + n - 1) % n] + ds[k]) / 2);
        u.push(Math.max(17, Math.min(vt / 3.6, Math.sqrt(30 * grip / Math.max(cu, 1e-5)))));
    }
    for (let r = 0; r < 3; r++) {
        for (let k = 0; k < n; k++) {
            const j = (k + 1) % n;
            u[j] = Math.min(u[j], Math.sqrt(u[k] * u[k] + 16 * grip * ds[k]));
        }
        for (let k = n - 1; k >= 0; k--) {
            const j = (k + 1) % n;
            u[k] = Math.min(u[k], Math.sqrt(u[j] * u[j] + 90 * grip * ds[k]));
        }
    }
    let T0 = 0;
    const cm = [0];
    for (let k = 0; k < n; k++) {
        T0 += ds[k] / u[k];
        cm.push(T0);
    }
    const dr = Array(n).fill(0);
    const bp = Array(n).fill(0);
    const runs = [];
    let s0 = -1;
    for (let k = 0; k <= n; k++) {
        const hi = k < n && u[k] > .93 * vt / 3.6;
        if (hi && s0 < 0)
            s0 = k;
        if (!hi && s0 >= 0) {
            runs.push([s0, k, D[k] - D[s0]]);
            s0 = -1;
        }
    }
    runs.sort((a, b) => b[2] - a[2]).slice(0, tr[TRACK.DRS_ZONES]).forEach(r => {
        for (let k = r[0]; k < r[1]; k++)
            dr[k] = 1;
    });
    for (let k = 0; k < n; k++) {
        const p = (k + n - 1) % n;
        const j = (k + 1) % n;
        if (u[j] < u[k] - .05 && u[p] <= u[k] + .05) {
            let m = j;
            let c = 0;
            while (u[(m + 1) % n] < u[m] - .02 && c++ < n)
                m = (m + 1) % n;
            const d = (u[k] - u[m]) * 3.6;
            if (d > 30)
                bp[k] = Math.min(1.3, d / 110);
        }
    }
    // ERS deployment zones: longest straights up to ~11 s of deployment per lap
    const ep = Array(n).fill(0);
    const rn = [];
    let q0 = -1;
    for (let k = 0; k <= n; k++) {
        const hi = k < n && u[k] > .82 * vt / 3.6;
        if (hi && q0 < 0)
            q0 = k;
        if (!hi && q0 >= 0) {
            let t = 0;
            for (let j = q0; j < k; j++)
                t += ds[j] / u[j];
            rn.push([q0, k, t]);
            q0 = -1;
        }
    }
    rn.sort((a, b) => b[2] - a[2]);
    let bud = 11;
    for (const r of rn) {
        if (bud <= 0)
            break;
        for (let k = r[0]; k < r[1]; k++)
            ep[k] = 1;
        bud -= r[2];
    }
    // optimal racing line: offset towards the inside of corners
    const og = [];
    for (let k = 0; k < n; k++) {
        const a = P[(k + n - 1) % n];
        const b = P[k];
        const c = P[(k + 1) % n];
        const g = Math.atan2(c[1] - b[1], c[0] - b[0]) - Math.atan2(b[1] - a[1], b[0] - a[0]);
        og.push(Math.atan2(Math.sin(g), Math.cos(g)));
    }
    let off = og.map(g => Math.max(-1, Math.min(1, g * 14)));
    for (let r = 0; r < 3; r++)
        off = off.map((_, k) => {
            let t = 0;
            for (let j = -12; j <= 12; j++)
                t += off[(k + j + n) % n];
            return t / 25;
        });
    const mo = Math.max(...off.map(Math.abs)) || 1;
    off = off.map(v => v / mo);
    let turnR = 0, turnL = 0;
    og.forEach(g => g > 0 ? turnR += g : turnL -= g);
    const pf = {
        n, Lm, D, ds, u, cm, T0, dr, bp, vt, off, ep
    };
    pf.rs = turnR / ((turnR + turnL) || 1);   // share of right-hand turning: left tyres are loaded more in right-hand corners
    const tA = x => {
        const k = indexAtDistance(pf, x);
        return cm[k] + (x - D[k]) / ds[k] * (cm[k + 1] - cm[k]);
    };
    const s1 = tA(Lm / 3);
    const s2 = tA(2 * Lm / 3) - s1;
    pf.sh = [s1 / T0, s2 / T0, (T0 - s1 - s2) / T0];
    return profileCache[key] = pf;
}

const indexAtDistance = (p, x) => {
    x = (x % p.Lm + p.Lm) % p.Lm;
    let a = 0;
    let b = p.n - 1;
    while (a < b) {
        const m = (a + b + 1) >> 1;
        if (p.D[m] <= x)
            a = m;
        else
            b = m - 1;
    }
    return a;
};

/**
 * Race simulation used by the "Test" tab.
 * 
 * Every car follows the track speed profile scaled by its own pace; it follows the car ahead,
 * attacks at braking points, uses DRS/ERS, pits according to its strategy and records sector/lap times.
 * 
 * Fields of a simulated car (state.sim.cs[i])
 *   c    the garage car              s    distance along the race in metres (negative = on the grid)
 *   v    speed km/h                  m    pace multiplier of the speed profile
 *   lt0  lap time at the start       lp   current lap (1 after crossing the line)
 *   sec  current sector (-1..2)      sc / ls  sector times of this / previous lap
 *   last / best  last and best lap   hl / hp / hc  per-lap time, position, tyre
 *   th / br  throttle / brake %      gr   gear
 *   er   ERS charge %                dp   deploying now        md  ERS mode label
 *   dr   DRS open                    att  running overtake manoeuvre   lo  lateral offset (m)
 *   comp tyre compound               age  tyre age (laps)      wr  tyre wear %      wf  setup wear factor
 *   sp   planned pit laps            si   current stint index
 *   pit  0 none, 1 entering the pit lane, 2 stationary, 3 leaving
 *   req  pit requested               pin / pl / stS / stC / stT  pit timing values
 *   ot / lost  overtakes made / positions lost
 *   fin  finish time (0 = still racing)
 */

const testLapTime = c => baseLapTime(c, state.tr) + modePaceDelta(c, TRACKS[state.tr]) + tyreTimeLoss(1, c.str.c[0], TRACKS[state.tr], tyreWearFactor(c)) + startFuel(c, raceLaps()) * .03;

const carsByPace = () => state.cars.map(c => ({ c, t: testLapTime(c) })).sort((a, b) => a.t - b.t);

// ---- Realistic driving ("human mode") ----
// Every driver gets random traits from the same distribution, so nobody is better or worse by design:
//   pen   steward penalty, s (added to the finishing time)    cons  consistency (higher = smaller pace scatter and fewer mistakes)    ag    aggression (attacks, risk)
//   tmg   tyre management (wear multiplier)    hold   launch reaction time, s    sd    lap pace scatter, s
// Timing loops: the lap is split into LOOPS points; every car records when it passed each point.
// Gaps are read from these times (like real timing), not estimated from distance.
const LOOPS = 60;

const NEUTRAL_TRAITS = { bigMul: 1, mistakeMul: 1, crashMul: 1, contactMul: 1, atkMul: 1, defMul: 1, nearMul: 1, wetRisk: 1, pen: 0, exp: .7, rac: .7, awa: .7, pz: 0, dg: 0, pnc: false, unpl: false, out: false, outT: 0, why: '', cons: 1, ag: 1, tmg: 1, hold: 0, sd: 0, nz: 0, wt: 0, wob: 0, err: null, errN: 0, errT: 0, slow: false };

// p = pilot ratings {exp, rac, awa, pac}, 1-99 (70 = baseline, see model/pilot.js):
//   EXP  experience: stays calm under pressure, gentle on the tyres, good starts
//   RAC  racecraft: attacks succeed more often, defending is harder to beat, good starts
//   AWA  awareness: steady laps, fewer mistakes, contacts and steward penalties
//   PAC  pace: raw speed per lap (about 0.2 s faster at 99, 0.55 s slower at 1)
function driverTraits(p) {
    const u = (a, b) => a + (b - a) * Math.random();
    const e = p.exp / 99, r = p.rac / 99, a = p.awa / 99;
    const cons = (.6 + .45 * a + .25 * e) * u(.95, 1.05);
    return {
        ...NEUTRAL_TRAITS, exp: e, rac: r, awa: a, cons,
        ag: u(.8, 1.2),
        tmg: (1.07 - .13 * e) * u(.98, 1.02),
        hold: Math.max(.12, .48 - .26 * (.5 * e + .5 * r) + u(-.06, .06)),
        sd: Math.max(.06, .12 + (1.3 - cons) * .56),
        pz: (70 - p.pac) * .008 * TRACKS[state.tr][TRACK.LAP_TIME] / 90,
    };
}

// Rolled once per braking zone. Mistakes are more likely with a car close ahead (pressure) and on worn tyres.
function driverMistakeCheck(c, ah, w, z) {
    const near = ah && ah.s - c.s < 40;
    const p = .0025 * w * (1 + (near ? 1.2 * (1.6 - 1.2 * c.exp) * c.nearMul : 0) + (c.wr > 85 ? 1 : 0)) * c.ag / c.cons * weatherRisk(state.tr) * c.mistakeMul * (state.weather == 'dry' ? 1 : c.wetRisk);
    if (Math.random() >= p) return;
    const r = Math.random();
    const wx = state.weather == 'dry' ? 1 : state.weather == 'damp' ? 1.5 : 2;   // wet weather: more big mistakes
    const big = r < .04 * wx * c.bigMul, wide = !big && r < .22 + .08 * (wx - 1);      // 4% off the track, 18% runs wide, the rest is a small lock-up
    c.err = big ? { t0: z.t, dur: 2.8, k: .5, lat: 8 } : wide ? { t0: z.t, dur: 1.8, k: .8, lat: 5 } : { t0: z.t, dur: 1, k: .93, lat: 0 };
    if (Math.random() < .5) c.err.lat = -c.err.lat;
    c.errN++;
    c.errT += c.err.dur * (1 - c.err.k);
    if (state.dnf && Math.random() < (big ? .3 : wide ? .04 : 0) * c.crashMul) {   // a big mistake can end in the barrier
        retireCar(c, z, 'авария, сход с гонки', '💥');
        return;
    }
    if (big && state.dnf && Math.random() < .3 * (1.5 - c.awa)) penalize(c, z, 5, 'выезд за пределы трассы');
    if (big) z.log.unshift(`${Math.max(1, c.lp)} кр.: ⚠️ ${carLabel(c.c)} выехал за пределы трассы`);
    else if (wide) z.log.unshift(`${Math.max(1, c.lp)} кр.: ⚠️ ${carLabel(c.c)} — ошибка на торможении`);
}

// ---- Crashes, damage and technical failures (switch "Crashes and DNF", state.dnf) ----
const FAIL_PARTS = ['двигатель', 'коробка передач', 'гидравлика', 'перегрев тормозов'];

// Retired cars are sorted last; running cars by distance.
const raceOrder = cs => [...cs].sort((a, b) => (a.out - b.out) || (b.s - a.s));

// Technical failure rate per second, from the reliability value of the car (roughly 1-5% per race).
const mechanicalRate = c => (100 - effectiveStats(c.c)[3]) / 100 * .0033 / c.lt0;

function mechanicalReason(c) {
    const part = c.c.s == 'f1' && Math.random() < .2 ? 'система ERS' : FAIL_PARTS[Math.floor(Math.random() * FAIL_PARTS.length)];
    return `технический отказ (${part}), сход`;
}

function retireCar(c, z, why, icon) {
    c.out = true;
    c.outT = z.t;
    c.why = why;
    c.att = null;
    c.req = false;
    c.err = null;
    c.side = Math.random() < .5 ? 1 : -1;               // side of the track the car rolls to
    z.dnf.push(c);
    playEvent(icon === '💥' ? 'crash' : 'fail', c.c);
    z.log.unshift(`${Math.max(1, c.lp)} кр.: ${icon} ${carLabel(c.c)} — ${why}`);
}

// Steward time penalty: added to the finishing time in the classification.
function penalize(c, z, seconds, why) {
    c.pen += seconds;
    z.log.unshift(`${Math.max(1, c.lp)} кр.: ⚖️ ${carLabel(c.c)} — штраф +${seconds} с (${why})`);
}

// Damage costs seconds per lap until the car pits (repairs add time to the stop).
function damageCar(c, z, seconds, text) {
    c.dg = Math.max(c.dg, seconds);
    c.req = true;
    c.unpl = true;                                       // unplanned stop: the strategy stays as it was
    z.log.unshift(`${Math.max(1, c.lp)} кр.: ⚠️ ${carLabel(c.c)} — ${text}`);
}

// Rolled when car a starts an attack on car d.
function contactCheck(a, d, z) {
    const p = (state.human ? .004 * a.ag * (1.85 - 1.2 * a.awa) : .001) * (a.lp <= 1 ? 2 : 1) * weatherRisk(state.tr) * a.contactMul * (state.weather == 'dry' ? 1 : a.wetRisk);
    if (Math.random() >= p) return;
    z.log.unshift(`${Math.max(1, a.lp)} кр.: ⚠️ контакт: ${carLabel(a.c)} × ${carLabel(d.c)}`);
    const r = Math.random();
    if (r < .5) damageCar(a, z, .5 + Math.random() * .7, 'повреждение переднего крыла');
    else if (r < .7) damageCar(d, z, .5 + Math.random() * .7, 'повреждение переднего крыла');
    else if (r < .85) {
        damageCar(a, z, 6, 'прокол');
        a.pnc = true;
    }
    else {
        retireCar(a, z, 'контакт, сход с гонки', '💥');
        if (Math.random() < .4) retireCar(d, z, 'контакт, сход с гонки', '💥');
    }
    if (state.human && Math.random() < clamp(.85 - .6 * a.awa, .15, .8)) penalize(a, z, 5, 'контакт');   // the attacker is usually blamed
}

function initSimulation() {
    const pf = trackProfile(state.tr);
    state.sim = {
        t: 0, log: [], res: [], cs: carsByPace().map(q => ({
            c: q.c, lt: q.t, lt0: q.t, m: pf.T0 / q.t, s: -(q.c.grid * 30 + 10), v: 0, pv: 0, k: 0, lp: 0, ts: 0, sec: -1, st: 0, sc: [0, 0, 0], ls: [0, 0, 0], last: 0, best: 0, er: 70, th: 0, br: 0, gr: 1, dr: 0, dp: 0, comp: q.c.str.c[0], wf: tyreWearFactor(q.c), sp: pitLaps(q.c, raceLaps()), si: 0, lo: 0, ot: 0, lost: 0, tt: 0, tf: 0, tb: 0, td: 0, eu: 0, eh: 0, vx: 0, hl: [], hp: [], hc: [], ps: [], fin: 0, wi: 0, att: null, rk: '', md: '', age: 1, wr: 0, s0: 0, pit: 0, req: false, pin: 0, pl: 0, stT: 0, stS: 0, stC: 0, bs: 0, ei: 0, ex: 0, lw: .4 + hashString('w' + q.c.id) * .3
        }))
    };
    state.kx = state.ky = state.ks = null;   // the camera jumps to the new race
    // driver traits (neutral values while the realistic mode is off)
    state.sim.dnf = [];
    state.sim.cs.forEach(c => {
        Object.assign(c, state.human ? driverTraits(effectivePilot(c.c)) : NEUTRAL_TRAITS);
        c.wf *= c.tmg;
        c.tl = new Float32Array((raceLaps() + 3) * LOOPS);   // time of passing each timing loop
        c.pi = -1;                                           // index of the last loop passed
    });
    if (state.human) {
        // the weakest cars of the field (bottom 20%, at least one) matter for the underdog trait
        const cs = state.sim.cs, weakest = new Set([...cs].sort((a, b) => b.lt0 - a.lt0).slice(0, Math.max(1, Math.round(cs.length * .2))));
        cs.forEach(c => applyTraits(c, weakest.has(c)));
    }
}

// How much later car c passed the timing loop that `other` (ahead) passed first; null if there is no data yet.
function gapSeconds(c, other) {
    const p = Math.min(c.pi, other.pi);
    if (p < 0 || p >= c.tl.length) return null;
    return Math.max(0, c.tl[p] - other.tl[p]);
}

// Record the time at which the car passes each timing loop (called right after the car has moved).
function recordLoops(c, z, L) {
    const Lk = L / LOOPS, pi = Math.floor(c.s / Lk);
    while (c.pi < pi) {
        c.pi++;
        if (c.pi >= 0 && c.pi < c.tl.length) c.tl[c.pi] = z.t - Math.max(0, c.s - c.pi * Lk) / Math.max(c.v / 3.6, 1);
    }
}

// Advance the simulation by dt seconds (called many times per animation frame).
function stepSimulation(dt) {
    const z = state.sim;
    const pf = trackProfile(state.tr);
    const L = pf.Lm;
    const tr = TRACKS[state.tr];
    const e = tr[TRACK.OVERTAKING];
    const EI = L - 350;
    const ord = raceOrder(z.cs);
    z.t += dt;
    if (!z.fin && ord[0].lp > raceLaps()) {
        z.fin = true;
        z.log.unshift('🏁 Финиш: победитель ' + carLabel(ord[0].c));
    }
    if (!z.done && z.cs.every(c => c.fin || c.out))
        z.done = true;
    // ---- per-car update ----
    ord.forEach((c, r) => {
        if (c.out) {                                      // retired: roll to a stop beside the track
            c.v = Math.max(0, c.v - 70 * dt);
            c.s += c.v / 3.6 * dt;
            recordLoops(c, z, L);
            c.lo += Math.max(-4 * dt, Math.min(4 * dt, c.side * 9 - c.lo));
            c.th = 0;
            c.br = c.v > 0 ? 60 : 0;
            c.dr = 0;
            c.dp = 0;
            return;
        }
        if (state.dnf && c.s > 0 && Math.random() < mechanicalRate(c) * dt) {
            retireCar(c, z, mechanicalReason(c), '🔧');
            return;
        }
        let ah = null;
        if (!c.pit)
            for (let j = r - 1; j >= 0; j--)
                if (!ord[j].pit) {
                    ah = ord[j];
                    break;
                }
        // tyres: age, wear and the resulting pace multiplier
        const k = indexAtDistance(pf, c.s);
        const f1 = c.c.s == 'f1';
        const ph = (c.s % L + L) % L;
        const lap = Math.floor(c.s / L);
        const life = TYRES[c.comp].l / (tr[TRACK.TYRE_WEAR] * c.wf * weatherTyreWear(c.comp));
        c.age = 1 + Math.max(0, (c.s - c.s0) / L);
        c.wr = Math.min(100, Math.round(c.age / life * 100));
        c.m = pf.T0 / (c.lt0 + tyreTimeLoss(c.age, c.comp, tr, c.wf) - tyreTimeLoss(1, c.c.str.c[0], tr, c.wf) - Math.max(0, c.s) / L * fuelBurnPerLap(c.c) * .03 + c.nz + c.pz + c.dg);
        if (!c.pit && !c.req && c.s > 0 && c.lp > 0 && ((c.sp.length > c.si && c.lp >= c.sp[c.si]) || c.wr >= 100))
            c.req = true;
        // pit entry (strategy lap reached, pit-entry line passed)
        if (c.req && !c.pit && c.s > 0 && ph >= EI && ph < L - 40) {
            c.pit = 1;
            c.wi = c.wr;
            c.pin = z.t;
            c.ei = lap * L + EI;
            c.bs = (lap + 1) * L + 30 + (c.c.t % 10) * 20 + (c.c.id % 2) * 8;
            c.ex = (lap + 1) * L + 430;
            c.stS = f1 ? 2 + Math.random() * 1.2 : 5.5 + Math.random() * 2;
            if (c.dg) c.stS += 2 + Math.random() * 1.5;   // repairs
            c.slow = false;
            if (state.human) {
                c.stS *= 1 + gauss() * .08;                   // crew and driver variation
                if (Math.random() < .05) {                    // rare problem: stuck wheel nut, late release ...
                    c.stS += 1.5 + Math.random() * 2.5;
                    c.slow = true;
                }
            }
        }
        // target speed (km/h) from the track profile, then pit-lane state machine
        let tv = pf.u[c.s < 0 ? 0 : k] * 3.6 * c.m;
        c.dr = 0;
        if (c.pit === 1) {
            const rem = c.bs - c.s;
            tv = Math.min(80, 3.6 * Math.sqrt(14 * Math.max(0, rem)));
            if (rem < .5) {
                c.pit = 2;
                playEvent('pit', c.c);
                c.stC = 0;
            }
        }
        else if (c.pit === 2) {
            tv = 0;
            c.stC += dt;
            if (c.stC >= c.stS) {
                c.stT = c.stS;
                if (c.slow) z.log.unshift(`🛠 ${carLabel(c.c)}: медленный пит-стоп (${c.stS.toFixed(1)} с)`);
                if (!c.unpl) {                            // planned stop: next stint of the strategy
                    c.si++;
                    c.comp = c.c.str.c[Math.min(c.si, c.c.str.c.length - 1)];
                }
                c.dg = 0;                                 // repaired, fresh tyres
                c.pnc = false;
                c.unpl = false;
                c.s0 = c.s;
                c.pit = 3;
            }
        }
        else if (c.pit === 3) {
            tv = 80;
            if (c.s >= c.ex) {
                c.pit = 0;
                c.req = false;
                c.pl = z.t - c.pin;
                c.ps.push({
                    lap: c.lp, pl: c.pl, st: c.stT, comp: c.comp, w: c.wi
                });
            }
        }
        // a mistake slows the car for a moment; at the start a human needs time to react
        if (c.err) {
            if (z.t - c.err.t0 > c.err.dur) c.err = null;
            else tv *= c.err.k;
        }
        if (state.human && z.t < c.hold) tv = 0;
        // following the car ahead, DRS and slipstream
        if (ah) {
            const g = ah.s - c.s;
            const gt = g / Math.max(c.v / 3.6, 20);                 // time gap to the car ahead, s
            const fast = pf.u[k] > .8 * pf.vt / 3.6;                // on a straight / in a fast section
            const spray = state.weather == 'dry' ? 1 : state.weather == 'damp' ? 1.3 : 1.8;   // water spray makes following harder
            if (!fast && gt < 1.2 * spray) tv *= 1 - .012 * spray * (1 - gt / (1.2 * spray));   // dirty air: less downforce in corners when close behind
            if (pf.dr[k] && c.s > L && state.weather !== 'rain' && g / Math.max(c.v / 3.6, 20) < 1) {   // DRS is not allowed in the rain
                c.dr = 1;
                tv *= 1.025;
            }
            if (g < 25 && fast)
                tv *= 1.006;                                        // slipstream
            if (g < 16 && !(c.att && c.att.t === ah))
                tv = Math.min(tv, ah.v + 2);
        }
        if (c.dp)
            tv *= 1.012;
        // overtake: decide at the next braking point, then run a visible side-by-side manoeuvre
        const prevK = c.k;
        c.k = k;
        // a car can skip profile points between two steps, so check every point it has just passed
        if (state.human && k !== prevK && c.s > 0 && !c.pit) {
            for (let i = (prevK + 1) % pf.n, guard = 0; guard < 8; i = (i + 1) % pf.n, guard++) {
                if (pf.bp[i]) driverMistakeCheck(c, ah, pf.bp[i], z);
                if (i === k) break;
            }
        }
        if (ah && !c.att && c.s > 0 && !c.pit) {
            const g = ah.s - c.s;
            if (g < 45 && c.v > ah.v - 6) {
                let d = 0;
                let bb = -1;
                for (let i = 0; i < 40 && d < 170; i++) {
                    const jj = (k + i) % pf.n;
                    if (pf.bp[jj]) {
                        bb = jj;
                        break;
                    }
                    d += pf.ds[jj];
                }
                if (bb >= 0 && c.rk !== bb + '|' + Math.floor(c.s / L)) {
                    c.rk = bb + '|' + Math.floor(c.s / L);
                    const pa = c.m / ah.m - 1;
                    const p = Math.max(0, Math.min(.9, e * e / 25 * pf.bp[bb] * (.05 + pa * 25 + (c.dr ? .3 : 0) + (f1 && c.er > 25 ? .1 : 0))));
                    if (Math.random() < (state.human ? p * (.8 + .4 * c.ag / 1.2) * (.7 + .6 * c.rac) * (1.2 - .4 * ah.rac) * c.atkMul * ah.defMul : p)) {
                        c.att = { t: ah, sg: pf.off[(bb + 30) % pf.n] >= 0 ? 1 : -1, t0: z.t };
                        z.log.unshift(`${Math.max(1, c.lp)} кр.: ${carLabel(c.c)} атакует ${carLabel(ah.c)}`);
                        if (state.dnf) contactCheck(c, ah, z);
                    }
                }
            }
        }
        let tl = 0;
        if (c.att) {
            const a2 = c.att.t;
            if (c.s > a2.s + 7) {
                z.log.unshift(`${Math.max(1, c.lp)} кр.: ✅ ${carLabel(c.c)} обошёл ${carLabel(a2.c)}`);
                c.ot++;
                a2.lost++;
                playEvent('overtake', c.c);
                playEvent('lost', a2.c);
                c.att = null;
            }
            else if (c.pit || a2.pit || z.t - c.att.t0 > 14 || a2.s - c.s > 80 || a2.out)   // gave up: too long or the gap grew
                c.att = null;
            else {
                tl = c.att.sg * 5.5;
                tv = Math.min(Math.max(tv * 1.03, a2.v + 12), tv * 1.1);   // never faster than the car can physically go here
            }
        }
        z.log.length = Math.min(z.log.length, 6);
        if (state.human) {
            if (z.t > c.wt) {                     // small wander around the racing line, a new value every ~second
                c.wt = z.t + .6 + Math.random() * .8;
                c.wob = (Math.random() - .5) * 1.4 / c.cons;
            }
            tl += c.wob + (c.err ? c.err.lat : 0);
        }
        c.lo += Math.max(-5 * dt, Math.min(5 * dt, tl - c.lo));
        // speed integration with acceleration / braking limits
        c.pv = c.v;
        c.v = tv > c.v ? Math.min(tv, c.v + 29 * dt) : Math.max(tv, c.v - 160 * dt);
        if (c.pit === 2)
            c.v = 0;
        c.s += c.v / 3.6 * dt;
        recordLoops(c, z, L);
        // telemetry: throttle, brake, gear
        const a = (c.v - c.pv) / dt;
        const br = a < -6 ? Math.min(100, -a / 1.6) : 0;
        let th;
        if (br)
            th = 0;
        else if (c.pit)
            th = c.pit === 2 ? 0 : 55;
        else if (tv > c.v + 1)
            th = 100;
        else
            th = c.v >= pf.vt * .96 ? 100 : 35 + c.v / pf.vt * 45;
        c.br = c.br * .6 + br * .4;
        c.th = c.th * .6 + th * .4;
        c.tt += dt;
        if (c.th > 90)
            c.tf += dt;
        if (c.br > 10)
            c.tb += dt;
        if (c.dr)
            c.td += dt;
        if (c.v > c.vx)
            c.vx = c.v;
        c.gr = (f1 ? [0, 70, 105, 145, 185, 225, 265, 300] : [0, 60, 100, 150, 200, 250]).filter(x => c.v >= x).length || 1;
        // ERS: deploy on planned straights or when attacking, harvest under braking
        if (f1) {
            const atk = ah && (ah.s - c.s) / Math.max(c.v / 3.6, 20) < 1.3 && c.er > 15;
            const want = c.th > 90 && c.v > 110 && !c.pit && c.c.str.er !== 'N' && (c.c.str.er === 'H' || pf.ep[k] || atk || c.er > 85 || (c.c.str.er === 'O' && c.er > 55));
            c.md = want ? (atk ? 'атака' : 'по плану') : (br > 10 ? 'рекуперация' : 'заряд');
            c.dp = want && c.er > 0 ? 1 : 0;
            if (c.dp) {
                c.er = Math.max(0, c.er - dt * 100 / 22);
                c.eu += dt * 100 / 22;
            }
            if (br > 10) {
                c.er = Math.min(100, c.er + dt * 100 / 26);
                c.eh += dt * 100 / 26;
            }
            else if (c.th < 60 && !c.dp)
                c.er = Math.min(100, c.er + dt * 100 / 160);
        }
        // sector and lap timing
        const sn = c.s < 0 ? -1 : Math.floor((c.s % L) / (L / 3));
        if (sn !== c.sec) {
            if (state.human && sn >= 0) c.nz = .55 * c.nz + gauss() * c.sd * .8;   // pace varies from sector to sector
            if (c.sec >= 0)
                c.sc[c.sec] = z.t - c.st;
            if (c.sec === 2 && sn === 0) {
                c.last = z.t - c.ts;
                c.ts = z.t;
                c.ls = [...c.sc];
                if (!c.best || c.last < c.best)
                    c.best = c.last;
                c.lp++;
                c.hl.push(c.last);
                c.hp.push(ord.indexOf(c) + 1);
                c.hc.push(c.comp);
                if ((c.lp > raceLaps() || z.fin) && !c.fin) {
                    c.fin = z.t;
                    z.res.push(c);
                playEvent('finish', c.c);
                }
            }
            if (c.sec === -1) {
                c.ts = z.t;
                c.lp = 1;
            }
            c.st = z.t;
            c.sec = sn;
        }
    });
}

/**
 * Compact pilot card: overall rating (RTG) on the left, four editable ratings on the right.
 * Only used in the Pilots tab (scope 'draft'): the sliders edit the pilot that is being created.
 */
const PILOT_NOTE = 'EXP — опыт · RAC — гоночное мастерство · AWA — осознанность · PAC — скорость · RTG — общий рейтинг (считается сам). Значения 1–99, действуют при включённой реалистичной езде.';

function pilotCardHtml(p, scope) {
    const rows = PILOT_STATS.map(([key, code, name]) => `<label title="${name}"><span>${code}</span><input type="range" min="1" max="99" step="1" value="${p[key]}" data-k="${key}" oninput="onPilotInput(this)"><b>${p[key]}</b></label>`).join('');
    return `<div class="pilot" data-scope="${scope}"><div class="rtg"><b>${pilotRating(p)}</b><small>RTG</small></div><div class="pst">${rows}</div></div>`;
}

const readPilotCard = card => Object.fromEntries([...card.querySelectorAll('input[data-k]')].map(i => [i.dataset.k, +i.value]));

function onPilotInput(e) {
    const card = e.closest('.pilot');
    e.nextElementSibling.textContent = e.value;
    const p = readPilotCard(card);
    card.querySelector('.rtg b').textContent = pilotRating(p);
    if (card.dataset.scope === 'draft') {
        draft().pil = p;
        updateDraftPreview();
    }
}

/**
 * Saved car setups. A preset stores the setup sheet and the race strategy (not the pilot) under a name and can be
 * loaded onto any car - the selected one. Presets are kept in this browser (localStorage); if the browser blocks
 * storage they live in memory until the page is closed.
 */
const PRESET_KEY = 'f1-engineer-setups';
let presetFallback = [];
let presetMessage = '';

function loadPresets() {
    try {
        return JSON.parse(localStorage.getItem(PRESET_KEY)) || [];
    } catch (e) {
        return presetFallback;
    }
}

function storePresets(list) {
    presetFallback = list;
    try {
        localStorage.setItem(PRESET_KEY, JSON.stringify(list));
    } catch (e) { /* memory only */ }
}

const cleanPresetName = v => v.replace(/[<>&"']/g, '').trim().slice(0, 22);

function presetsHtml() {
    const c = currentCar(), list = loadPresets(), msg = presetMessage;
    presetMessage = '';
    return `<div class="g">Сохранённые настройки</div>
<div class="row"><input type="text" id="psn" maxlength="22" value="${cleanPresetName(c.name || SERIES[c.s].t[c.t][0])} · ${TRACKS[state.tr][TRACK.NAME]}"><button onclick="savePreset()">💾 Сохранить</button></div>
<div class="row"><select id="psl">${list.length ? list.map(p => `<option value="${p.id}">${p.name}</option>`).join('') : '<option value="">нет сохранённых</option>'}</select><button onclick="applyPreset()">⬇ Загрузить</button><button onclick="deletePreset()">🗑</button></div>
<div class="mu">${msg || 'Сохраняются сетап и стратегия гонки (без пилота), хранятся в этом браузере. Загрузка применяется к выбранному болиду.'}</div>`;
}

function savePreset() {
    const c = currentCar(), name = cleanPresetName($('psn').value) || 'Настройки';
    const list = loadPresets().filter(p => p.name !== name);
    list.push({ id: Date.now(), name, su: { ...c.su }, str: JSON.parse(JSON.stringify(c.str)) });
    storePresets(list);
    presetMessage = 'Сохранено: ' + name;
    renderCarTab();
}

function applyPreset() {
    const p = loadPresets().find(x => x.id == $('psl').value);
    if (!p) return;
    const c = currentCar();
    c.su = { ...c.su, ...p.su };
    c.str = JSON.parse(JSON.stringify(p.str));
    presetMessage = 'Загружено: ' + p.name;
    renderCarTab();
}

function deletePreset() {
    const id = $('psl').value;
    const p = loadPresets().find(x => x.id == id);
    if (!p) return;
    storePresets(loadPresets().filter(x => x.id != id));
    presetMessage = 'Удалено: ' + p.name;
    renderCarTab();
}

/**
 * Weather card of the strategy tab (the race tab has a button that cycles the weather).
 */
function weatherCardHtml() {
    const buttons = Object.entries(WEATHER_MODES).map(([k, m]) => `<button${state.weather == k ? ' class="on"' : ''} onclick="setWeather('${k}')">${m.icon} ${m.name}</button>`).join('');
    return `<div class="card"><h3>Погода</h3><div class="seg">${buttons}</div><div class="mu" style="margin-top:6px">${weatherNote(state.tr)}</div></div>`;
}

/**
 * Draws the surroundings of the track on the race map: sea and lakes, trees and buildings, landmarks and grandstands.
 * Trees and buildings are placed once per track (seeded random, so a track always looks the same) and only drawn
 * when they are on screen.
 */
const envCache = {};

function seeded(seed) {
    let a = (seed + 1) * 2654435761 >>> 0;
    return () => {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

const ENV_LOOK = {   // spacing, min and max distance from the track (m)
    forest: [18, 45, 450], park: [55, 50, 420], city: [58, 42, 480], sand: [75, 40, 420],
};
const ENV_EXTRA_SIZE = { wheel: 50, tower: 20, stadium: 90, hotel: 55 };   // clearance radius in m

// bb = track bounding box [minX, minY, maxX, maxY] in map units, ppm = map units per metre
function buildEnvironment(i, P, bb, ppm) {
    const env = ENVIRONMENT[i], rnd = seeded(i), [bx, by, ex, ey] = bb;
    const out = { items: [], extras: [], sea: null, lake: null };
    const edge = { S: ey, N: by, E: ex, W: bx };
    const wave = (v, amp) => amp * ppm * Math.sin(v / (180 * ppm));
    if (env.sea) {
        const d = env.sea.dir, g = env.sea.gap * ppm, far = 6000 * ppm, pad = 800 * ppm, step = 60 * ppm;
        const sgn = (d == 'S' || d == 'E') ? 1 : -1, base = edge[d] + sgn * g, pts = [];
        const [a0, a1] = (d == 'S' || d == 'N') ? [bx - pad, ex + pad] : [by - pad, ey + pad];
        for (let v = a0; v <= a1; v += step) pts.push([v, base + wave(v, 30)]);
        pts.push([a1, base + sgn * far], [a0, base + sgn * far]);
        out.sea = (d == 'S' || d == 'N') ? pts : pts.map(p => [p[1], p[0]]);
    }
    if (env.lake) {
        const [fx, fy, frx, fry] = env.lake, cx = bx + fx * (ex - bx), cy = by + fy * (ey - by), rx = frx * (ex - bx), ry = fry * (ey - by);
        out.lake = Array.from({ length: 48 }, (_, k) => [cx + rx * Math.cos(k / 48 * 6.283) * (1 + .06 * Math.sin(k * 3)), cy + ry * Math.sin(k / 48 * 6.283) * (1 + .06 * Math.sin(k * 3))]);
        out.lakeEllipse = [cx, cy, rx, ry];
    }
    const inWater = (x, y) => {
        if (env.sea) {
            const d = env.sea.dir, g = env.sea.gap * ppm;
            if ((d == 'S' && y > ey + g) || (d == 'N' && y < by - g) || (d == 'E' && x > ex + g) || (d == 'W' && x < bx - g)) return true;
        }
        if (out.lakeEllipse) {
            const [cx, cy, rx, ry] = out.lakeEllipse;
            if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1.2) return true;
        }
        return false;
    };
    const S = P.filter((_, k) => k % 6 == 0);
    const minD2 = (x, y) => {
        let m = Infinity;
        for (const p of S) {
            const d = (p[0] - x) ** 2 + (p[1] - y) ** 2;
            if (d < m) m = d;
        }
        return m;
    };
    const [sp0, dmin, dmax] = ENV_LOOK[env.around];
    const margin = dmax * ppm;
    const area = (ex - bx + 2 * margin) * (ey - by + 2 * margin) / (ppm * ppm);
    const sp = Math.max(sp0, Math.sqrt(area / 5500)), stepU = sp * ppm;
    const palette = env.around == 'city' ? (env.pal == 'glass' ? ['#3f4757', '#505a6e', '#2f3647', '#5b6881'] : ['#b9b3a7', '#a6a095', '#cdc4b0', '#9a9ea8'])
        : env.around == 'forest' ? ['#1f5a2e', '#2a6b36', '#245f31'] : env.around == 'park' ? ['#3b7f40', '#47904a', '#2f7035'] : ['#a8955c', '#b7a36a'];
    for (let x = bx - margin; x < ex + margin; x += stepU)
        for (let y = by - margin; y < ey + margin; y += stepU) {
            const jx = x + (rnd() - .5) * stepU * .8, jy = y + (rnd() - .5) * stepU * .8, c = palette[Math.floor(rnd() * palette.length)], q = rnd();
            if (inWater(jx, jy)) continue;
            const d2 = minD2(jx, jy);
            if (d2 < (dmin * ppm) ** 2 || d2 > (dmax * ppm) ** 2) continue;
            if (env.around == 'city') {
                if (q < .22) continue;
                out.items.push({ x: jx, y: jy, k: 'b', w: sp * (.4 + q * .4) * ppm, h: sp * (.4 + rnd() * .4) * ppm, c, tall: env.pal == 'glass' || q > .85 });
            } else {
                out.items.push({ x: jx, y: jy, k: 't', r: (env.around == 'sand' ? 2.5 + q * 1.5 : 4.5 + q * 4.5) * ppm, c });
            }
        }
    (env.extras || []).forEach(([kind, fx, fy]) => {
        const rm = ENV_EXTRA_SIZE[kind], bxp = bx + fx * (ex - bx), byp = by + fy * (ey - by);
        for (let k = 0; k < 30; k++) {            // search outwards for a free spot
            const ang = k * 2.4, dist = k ? (rm + 80) * ppm * (1 + Math.floor(k / 8)) : 0;
            const x = bxp + Math.cos(ang) * dist, y = byp + Math.sin(ang) * dist;
            if (!inWater(x, y) && minD2(x, y) > ((rm + 50) * ppm) ** 2) {
                out.extras.push({ kind, x, y, rm });
                break;
            }
        }
    });
    return out;
}

// E = { i, P, bb, ppm, sc, cx, cy, w, h, pm }: track index, outline, bounding box, units per metre, camera scale/centre, canvas size, px per metre
function drawEnvironment(x, E) {
    const env = envCache[E.i] || (envCache[E.i] = buildEnvironment(E.i, E.P, E.bb, E.ppm));
    const W = E.w, H = E.h, S = E.sc;
    const sx = u => W / 2 + (u - E.cx) * S, sy = v => H / 2 + (v - E.cy) * S;
    const poly = (pts, fill) => {
        x.beginPath();
        pts.forEach((p, k) => k ? x.lineTo(sx(p[0]), sy(p[1])) : x.moveTo(sx(p[0]), sy(p[1])));
        x.closePath();
        x.fillStyle = fill;
        x.fill();
        x.strokeStyle = 'rgba(255,255,255,.45)';
        x.lineWidth = 2;
        x.stroke();
    };
    if (env.sea) poly(env.sea, '#2f78b5');
    if (env.lake) poly(env.lake, '#3a86c4');
    for (const it of env.items) {
        const px = sx(it.x), py = sy(it.y);
        if (px < -60 || py < -60 || px > W + 60 || py > H + 60) continue;
        if (it.k == 't') {
            const r = Math.max(1.2, it.r * S);
            x.fillStyle = 'rgba(0,0,0,.22)';
            x.beginPath();
            x.arc(px + r * .25, py + r * .25, r, 0, 6.283);
            x.fill();
            x.fillStyle = it.c;
            x.beginPath();
            x.arc(px, py, r, 0, 6.283);
            x.fill();
        } else {
            const bw = Math.max(2, it.w * S), bh = Math.max(2, it.h * S);
            if (it.tall) {                       // shadow of a tall building
                x.fillStyle = 'rgba(0,0,0,.25)';
                x.fillRect(px - bw / 2 + bw * .18, py - bh / 2 + bh * .18, bw, bh);
            }
            x.fillStyle = it.c;
            x.fillRect(px - bw / 2, py - bh / 2, bw, bh);
            if (bw > 8) {
                x.strokeStyle = 'rgba(0,0,0,.3)';
                x.lineWidth = 1;
                x.strokeRect(px - bw / 2, py - bh / 2, bw, bh);
            }
        }
    }
    for (const e of env.extras) {
        const px = sx(e.x), py = sy(e.y), r = e.rm * E.pm;
        if (px < -r * 2 || py < -r * 2 || px > W + r * 2 || py > H + r * 2) continue;
        if (e.kind == 'wheel') {                  // ferris wheel
            x.strokeStyle = '#d8dce2';
            x.lineWidth = Math.max(1, r * .08);
            x.beginPath();
            x.arc(px, py, r, 0, 6.283);
            x.stroke();
            for (let k = 0; k < 12; k++) {
                x.beginPath();
                x.moveTo(px, py);
                x.lineTo(px + r * Math.cos(k * .5236), py + r * Math.sin(k * .5236));
                x.stroke();
            }
        } else if (e.kind == 'tower') {           // observation tower
            x.fillStyle = 'rgba(0,0,0,.25)';
            x.beginPath();
            x.arc(px + r * .5, py + r * .5, r, 0, 6.283);
            x.fill();
            x.fillStyle = '#c9ced6';
            x.beginPath();
            x.arc(px, py, r, 0, 6.283);
            x.fill();
            x.fillStyle = '#6b7380';
            x.beginPath();
            x.arc(px, py, r * .45, 0, 6.283);
            x.fill();
        } else if (e.kind == 'stadium') {         // stadium: stands around a pitch
            x.fillStyle = '#6a6f78';
            x.beginPath();
            x.ellipse(px, py, r, r * .7, 0, 0, 6.283);
            x.fill();
            x.fillStyle = '#4f8f52';
            x.beginPath();
            x.ellipse(px, py, r * .68, r * .42, 0, 0, 6.283);
            x.fill();
            x.strokeStyle = 'rgba(255,255,255,.7)';
            x.lineWidth = 1;
            x.strokeRect(px - r * .5, py - r * .28, r, r * .56);
        } else {                                  // hotel
            x.fillStyle = '#cfd5dc';
            x.fillRect(px - r, py - r * .45, r * 2, r * .9);
            x.fillStyle = '#5b7a99';
            x.fillRect(px - r * .9, py - r * .2, r * 1.8, r * .4);
        }
    }
}

// Grandstands next to the track. rw = drawn width of the road in px, at/po = position helpers of drawRace.
function drawStands(x, E, rw, at, po, L) {
    const env = ENVIRONMENT[E.i], pm = E.pm, inner = rw / 2 + 24;     // px from the centre line
    const crowd = ['#d33a3a', '#3a63d3', '#f0c030', '#e8e8e8'];
    (env.stands || []).forEach(([frac, side, len], n) => {
        (side ? [side] : [1, -1]).forEach(sg => {
            const s0 = frac * L, steps = Math.max(2, Math.round(len / 12));
            const line = lat => {
                x.beginPath();
                for (let k = 0; k <= steps; k++) {
                    const s = s0 + len * k / steps;
                    // grandstands next to the pit lane are moved back behind the pit buildings
                    const pit = sg > 0 && ((s % L + L) % L > L - 350 || (s % L) < 430);
                    const p = po(s, sg * (inner + lat + (pit ? 40 : 0)) / pm);
                    k ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]);
                }
                x.stroke();
            };
            x.lineCap = 'butt';
            x.strokeStyle = '#3a3f48';
            x.lineWidth = Math.max(4, 24 * pm);
            line(Math.max(4, 24 * pm) / 2);
            x.strokeStyle = crowd[(E.i + n) % crowd.length];
            x.lineWidth = Math.max(3, 13 * pm);
            x.setLineDash([Math.max(2, 3 * pm), Math.max(1, 1.5 * pm)]);
            line(Math.max(4, 24 * pm) / 2);
            x.setLineDash([]);
        });
    });
}

function autoStrategy() {
    const c = currentCar();
    const tr = TRACKS[state.tr];
    const N = raceLaps();
    const b = baseLapTime(c, state.tr);
    let best = null;
    for (let n = 1; n <= 3; n++) {
        const stp = n == 3 ? Math.max(2, Math.round(N / 18)) : n == 2 ? 2 : 1;
        const cs = [];
        const ps = [];
        (function g(a) {
            if (a.length == n + 1)
                return cs.push(a);
            for (const m of COMPOUND_SETS[state.weather])
                g([...a, m]);
        })([]);
        (function g(a, s) {
            if (a.length == n)
                return ps.push(a);
            for (let p = s; p <= N - 3; p += stp)
                g([...a, p], p + 4);
        })([], 4);
        for (const a of cs) {
            if (state.weather == 'dry' && new Set(a).size < 2)
                continue;
            for (const p of ps) {
                const t = simulateRace(b, tr, N, a, p, c).t;
                if (!best || t < best.t)
                    best = { t, a, p };
            }
        }
    }
    if (best) {
        c.str = { ...c.str, c: best.a, f: best.p.map(p => p / N) };
        renderStrategyTab();
    }
}

function renderStrategyResult() {
    const c = currentCar();
    const tr = TRACKS[state.tr];
    const N = raceLaps();
    const p = pitLaps(c, N);
    const r = simulateRace(baseLapTime(c, state.tr), tr, N, c.str.c, p, c);
    const e = effectiveStats(c);
    const ok = state.weather != 'dry' || new Set(c.str.c).size > 1;   // the two-compound rule applies to dry races only
    const rows = state.cars.map(x => {
        const q = pitLaps(x, N);
        return { x, t: simulateRace(baseLapTime(x, state.tr), tr, N, x.str.c, q, x).t };
    }).sort((a, b) => a.t - b.t);
    $('out').innerHTML = `<div class="card"><div class="mu">Время гонки · ${tr[TRACK.NAME]} · ${N} кр.</div><div class="big">${formatTime(r.t)}</div>
<div class="mu">Средний круг ${formatTime(r.t / N)} · пит-стопы ${p.length}×${tr[TRACK.PIT_LOSS]} с · риск отказа ≈ ${((100 - e[3]) * .15 * N / 60).toFixed(1)}%</div>
<div class="mu">Топливо на финише: ${r.fr.toFixed(1)} кг</div>${r.fr < 0 ? '<div class="bad">Топлива не хватит до финиша</div>' : ''}${ok ? '' : '<div class="bad">В сухой гонке нужно минимум два разных состава шин</div>'}<canvas id="cv"></canvas>
<div class="mu">Время круга по ходу гонки (пики пит-стопов обрезаны), фон — состав шин</div></div>
<div class="card"><h3>Сравнение болидов в гараже</h3><table>${rows.map((q, i) => `<tr><td>${i + 1}</td><td><span style="color:${teamColor(q.x)}">●</span> ${carLabel(q.x)}</td><td>${formatTime(q.t)}</td><td>${i ? '+' + (q.t - rows[0].t).toFixed(1) + ' с' : ''}</td></tr>`).join('')}</table></div>`;
    const cv = $('cv');
    const w = cv.width = cv.clientWidth;
    const h = cv.height = 150;
    const x = cv.getContext('2d');
    const mn = Math.min(...r.l);
    const mx = mn + 6;
    const ed = [0, ...p, N];
    for (let j = 0; j < ed.length - 1; j++) {
        x.globalAlpha = .3;
        x.fillStyle = TYRES[c.str.c[j]].c;
        x.fillRect(ed[j] / N * w, 0, (ed[j + 1] - ed[j]) / N * w, h);
    }
    x.globalAlpha = 1;
    x.strokeStyle = getComputedStyle(document.body).color;
    x.lineWidth = 2;
    x.beginPath();
    r.l.forEach((v, i) => {
        const X = (i + .5) / N * w;
        const Y = h - 8 - (Math.min(v, mx) - mn) / (mx - mn) * (h - 16);
        i ? x.lineTo(X, Y) : x.moveTo(X, Y);
    });
    x.stroke();
}

function togglePitRequest() {
    const c = state.sim.cs.find(q => q.c === currentCar());

function setGridPosition(id, g) {
    const c = state.cars.find(x => x.id == id);
    const o = state.cars.find(x => x.grid == g);
    o.grid = c.grid;
    c.grid = g;
    renderTestTab();
}

function autoGrid() {
    carsByPace().forEach((q, i) => q.c.grid = i);
    renderTestTab();
