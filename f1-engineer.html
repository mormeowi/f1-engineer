// % полного газа, прижим 1-5, повороты, DRS, лёгкость обгона 1-5 | контур (упрощённый)
const TX=['66,3,14,2,3|30,82 55,84 78,80 90,66 86,52 74,46 80,32 70,18 50,14 30,18 16,30 14,46 24,58 18,70','70,3,15,3,4|8,60 60,60 74,54 66,44 80,36 92,46 88,66 72,76 56,68 44,78 28,72 16,80 8,72','72,2,23,3,4|10,70 60,70 80,64 90,50 80,38 62,42 54,30 66,18 46,12 30,22 40,34 24,44 14,56','63,3,16,2,4|20,70 70,72 85,62 78,50 62,48 50,56 42,46 54,36 68,34 80,24 66,14 40,16 24,26 14,40 28,52 20,60','62,4,14,2,2|30,78 60,80 82,70 86,54 74,42 60,48 50,36 62,22 44,14 26,22 16,38 22,54 14,66','63,4,16,2,2|14,60 60,62 80,58 86,46 74,38 60,42 52,32 66,22 50,14 34,22 38,34 24,40 16,50','40,5,19,1,1|84,24 70,18 56,24 44,36 34,34 24,44 30,56 20,66 34,76 48,70 60,76 74,70 84,58 78,46','75,1,20,2,4|10,70 80,70 90,60 90,42 78,36 66,40 60,28 46,26 40,16 26,14 22,24 14,34 10,48','70,2,14,2,4|12,72 78,72 90,60 82,48 66,52 50,42 70,30 80,20 60,14 30,18 16,28 24,42 14,56','66,3,15,2,3|14,60 58,64 76,60 86,48 78,36 64,42 54,30 68,18 50,12 34,22 40,34 26,40 14,48','70,2,10,2,4|20,76 78,70 90,52 70,44 74,28 56,16 38,24 28,40 12,52 14,68','68,3,18,2,4|20,64 50,70 72,66 84,54 76,42 62,46 56,36 68,26 52,16 34,20 28,32 14,36 10,50','55,5,14,1,1|30,72 60,74 80,66 84,52 70,46 58,52 46,44 56,32 72,28 76,16 56,12 38,20 28,34 18,46 20,60','75,2,19,2,4|30,84 40,66 28,58 38,46 24,36 38,24 60,14 80,22 70,36 84,48 72,60 54,56 46,70 52,82','80,1,11,2,4|10,72 70,72 78,66 84,60 88,48 80,36 60,30 40,24 22,20 12,32 20,46 14,58','50,5,23,3,2|20,78 52,78 54,66 76,66 80,54 62,50 60,36 78,32 80,18 52,16 46,28 26,28 20,44 34,52 18,60','68,2,18,2,3|14,70 50,72 70,66 82,52 74,40 58,34 66,22 48,14 30,20 24,32 36,42 22,52','66,4,18,1,2|12,70 52,74 76,66 84,52 66,44 50,52 36,44 30,30 46,20 66,26 78,40 60,60 34,58 18,48 20,60','62,3,20,2,4|10,72 40,70 46,50 30,42 40,28 60,24 74,34 86,26 90,40 76,52 84,64 66,72 50,82','60,4,17,3,3|10,60 76,60 88,54 86,42 72,40 62,48 50,40 56,28 72,24 60,14 34,14 24,26 18,40 22,52','66,3,15,2,4|70,76 50,80 34,72 24,60 34,48 52,52 64,44 54,32 38,26 26,34 20,48 16,36 28,18 50,14 78,22 86,40 78,60','62,3,16,2,4|14,66 60,68 78,60 88,48 80,38 66,42 56,32 42,38 36,24 20,24 12,38 18,52'];
T.forEach((t,i)=>{const[a,b]=TX[i].split('|');t.push(...a.split(',').map(Number),b)});
const pwr=i=>Math.min(.46,Math.max(.2,.2+(T[i][6]-40)*.0065));
const tinfo=i=>{const t=T[i];return `${t[1]} км · ${t[8]} поворотов · DRS: ${t[9]} · полный газ ${t[6]}% · прижим ${t[7]}/5 · износ шин ${t[5]} · обгоны ${t[10]}/5`};
// F1: [команда, двигатель, аэро, шасси, надёжность, цвет]; F2: [команда, уровень, цвет]
const SER={
f1:{n:'F1 2020',s:'F1 20',k:1,b:1.75,x:110,t:[['Mercedes',98,100,96,92,'#00d2be'],['Red Bull',88,92,92,84,'#1e41ff'],['McLaren',82,82,84,82,'#ff8700'],['Racing Point',94,85,84,80,'#f596c8'],['Renault',78,80,80,76,'#fff500'],['Ferrari',76,84,82,70,'#dc0000'],['AlphaTauri',82,76,76,76,'#4e7c9b'],['Alfa Romeo',74,72,74,72,'#9b0000'],['Haas',74,70,72,70,'#9ea3a8'],['Williams',90,58,62,74,'#00a0de']]},
f2:{n:'F2 2020',s:'F2 20',k:1.115,b:1.15,x:80,t:[['Prema',90,'#d4141c'],['UNI-Virtuosi',88,'#1f3f8f'],['Carlin',86,'#00a859'],['Hitech',84,'#e7c500'],['ART',82,'#b0b4ba'],['Campos',80,'#f26522'],['MP Motorsport',80,'#ff3d9a'],['DAMS',78,'#0097d6'],['Charouz',76,'#8bc34a'],['Trident',74,'#7b1fa2']]},
f19:{n:'F2 2019',s:'F2 19',k:1.12,b:1.15,x:80,t:[['Prema',90,'#d4141c'],['Carlin',88,'#00a859'],['UNI-Virtuosi',86,'#1f3f8f'],['ART',84,'#b0b4ba'],['DAMS',82,'#0097d6'],['MP Motorsport',80,'#ff3d9a'],['Campos',78,'#f26522'],['Trident',76,'#7b1fa2'],['Charouz',74,'#8bc34a'],['HWA',70,'#555b63']]}};
// [ключ, название, мин, макс, шаг, по умолчанию, группа]
const SU=[['fw','Переднее крыло',0,50,1,25,'Аэродинамика'],['rw','Заднее крыло',0,50,1,25],['dn','Дифференциал на газу, %',10,100,5,60,'Трансмиссия'],['df','Дифференциал без газа, %',10,100,5,50],['fc','Развал спереди',-3.5,-2.5,.1,-3,'Геометрия'],['rc','Развал сзади',-2,-1,.1,-1.5],['ft','Схождение спереди',0,.5,.01,.05],['rt','Схождение сзади',.1,.5,.01,.2],['fs','Подвеска спереди',1,11,1,6,'Подвеска'],['rs','Подвеска сзади',1,11,1,6],['fa','Стабилизатор спереди',1,11,1,6],['ra','Стабилизатор сзади',1,11,1,6],['fh','Клиренс спереди',10,40,1,25],['rh','Клиренс сзади',40,100,1,70],['bp','Давление тормозов, %',80,100,1,90,'Тормоза и шины'],['bb','Баланс тормозов, %',50,70,1,58],['pfl','Давление шин ПЛ, psi',22.5,29.5,.1,25],['pfr','Давление шин ПП, psi',22.5,29.5,.1,25],['prl','Давление шин ЗЛ, psi',20.5,26.5,.1,22.5],['prr','Давление шин ЗП, psi',20.5,26.5,.1,22.5]];
const CP={S:{o:0,d:.09,l:16,c:'#e53935',n:'Софт'},M:{o:.7,d:.05,l:26,c:'#fdd835',n:'Медиум'},H:{o:1.3,d:.028,l:40,c:'#cfd3d8',n:'Хард'}};
const S={cars:[],a:0,tr:0,eq:false,pct:100,tab:0,tc:'S',fuel:10,spd:5,run:false,tm:0,cam:true};let uid=0,last=0;
const hs=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967296};
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fmt=t=>{const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+s.toFixed(3).padStart(6,'0')};
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const stats=(s,i)=>{const t=SER[s].t[i];return s=='f1'?t.slice(1,5):[80,t[1],t[1],t[1]]};
const col=c=>{const t=SER[c.s].t[c.t];return t[t.length-1]};
const lab=c=>SER[c.s].s+' '+SER[c.s].t[c.t][0];
const mk=(s,i)=>({id:++uid,s,t:i,st:stats(s,i),su:Object.fromEntries(SU.map(d=>[d[0],d[5]])),str:{c:['M','H'],f:[.45]}});
const cur=()=>S.cars[S.a];const hp=c=>c.s=='f1'?Math.round(760+2.5*eff(c)[0]):620;const eff=c=>S.eq?[80,80,80,80]:c.st;
const nL=()=>Math.max(3,Math.round(T[S.tr][2]*S.pct/100));
const ideal=(d,i)=>d[0]=='fw'||d[0]=='rw'?cl(8+T[i][7]*7,0,50):cl(d[5]+(hs(T[i][0]+d[0])-.5)*.3*(d[3]-d[2]),d[2],d[3]);
function pen(c,i){let s=0;for(const d of SU)s+=Math.abs(c.su[d[0]]-ideal(d,i))/(d[3]-d[2]);return s*.8*T[i][3]/90}
function base(c,i){const w=pwr(i),e=eff(c),sc=e[0]*w+e[1]*(.8-w)+e[2]*.2;return T[i][3]*SER[c.s].k*(1+(100-sc)*.0006)+pen(c,i)}
const tyre=(k,m,tr)=>{const p=CP[m],L=p.l/tr[5];return(p.o+p.d*tr[5]*k+(k>L?(k-L)*.22:0))*tr[3]/90};
function race(b,tr,N,cs,p,c){const Q=SER[c.s],F=Math.min(Q.x,N*Q.b+2);let t=0,si=0,k=0;const l=[];for(let i=0;i<N;i++){let x=b+tyre(k++,cs[si],tr)+Math.max(0,F-Q.b*i)*.03+(i?0:3+c.grid*.15*(6-tr[10])/3);if(si<p.length&&i+1==p[si]){x+=tr[4];si++;k=0}l.push(x);t+=x}return{l,t}}
const pits=(c,N)=>c.str.f.map(f=>cl(Math.round(f*N),3,N-3));
const noCar=()=>$('m').innerHTML='<div class="card">Добавьте болид во вкладке «Болид».</div>';
const sl=(l,k,v,a,b,s,fn,dis)=>`<label class="sl"><span>${l}</span><b>${v}</b><input type="range" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${v}"${dis?' disabled':''} oninput="${fn}(this)"></label>`;
const opts=(a,sel)=>a.map((x,i)=>`<option value="${i}"${i==sel?' selected':''}>${x}</option>`).join('');
// ---------- Болид ----------
function r0(){const c=cur();let h=`<div class="card"><h3>Добавить болид</h3><div class="row"><select id="ns" onchange="nt()">${Object.keys(SER).map(k=>`<option value="${k}">${SER[k].n}</option>`).join('')}</select><select id="nm"></select><button class="pr" onclick="addC()">＋ Добавить</button></div></div>`;
if(c){const e=eff(c);h+=`<div class="card"><h3>${lab(c)}</h3><div class="row"><select onchange="chT(+this.value)">${opts(SER[c.s].t.map(t=>t[0]),c.t)}</select><button onclick="dup()">Копия</button><button onclick="del()">Удалить</button></div>
<p class="mu" id="inf"></p><div class="g">Характеристики болида${S.eq?' (равная мощность: значения команд не учитываются, настройки сохраняются)':''}</div>`+['Силовая установка','Аэродинамика','Шасси','Надёжность'].map((n,i)=>sl(n,i,e[i],40,100,1,'stt',S.eq)).join('')+`<div class="row" style="margin-top:8px"><button class="pr" onclick="autoSu()">⚙️ Подобрать настройки под трассу</button><button onclick="rstSu()">Сбросить</button></div>`;
for(const d of SU)h+=(d[6]?`<div class="g">${d[6]}</div>`:'')+sl(d[1],d[0],c.su[d[0]],d[2],d[3],d[4],'sus');h+='</div>'}
$('m').innerHTML=h;nt();inf()}
function nt(){const s=$('ns').value;$('nm').innerHTML=opts(SER[s].t.map(t=>t[0]),0)}
const norm=()=>[...S.cars].sort((a,b)=>a.grid-b.grid).forEach((c,i)=>c.grid=i);
function addC(){const c=mk($('ns').value,+$('nm').value);c.grid=999;S.cars.push(c);norm();S.a=S.cars.length-1;go()}
function chT(i){const c=cur();c.t=i;c.st=stats(c.s,i);go()}
function dup(){const c=cur(),n=JSON.parse(JSON.stringify(c));n.id=++uid;n.grid=999;S.cars.push(n);norm();S.a=S.cars.length-1;go()}
function del(){S.cars.splice(S.a,1);norm();S.a=Math.max(0,S.a-1);go()}
function stt(e){cur().st[+e.dataset.k]=+e.value;e.previousElementSibling.textContent=e.value;inf()}
function sus(e){cur().su[e.dataset.k]=+e.value;e.previousElementSibling.textContent=e.value;inf()}
function autoSu(){const c=cur();for(const d of SU)c.su[d[0]]=+(Math.round(ideal(d,S.tr)/d[4])*d[4]).toFixed(2);r0()}
function rstSu(){const c=cur();for(const d of SU)c.su[d[0]]=d[5];r0()}
function inf(){const c=cur(),e=$('inf');if(!c||!e)return;e.textContent=`${T[S.tr][0]}: чистый круг ≈ ${fmt(base(c,S.tr))} · потери из-за настроек +${pen(c,S.tr).toFixed(2)} с · мощность ≈ ${hp(c)} л.с.`}
// ---------- Стратегия ----------
function r1(){const c=cur();if(!c)return noCar();const N=nL(),st=c.str,p=pits(c,N),n=st.f.length;
let h=`<div class="card"><h3>Дистанция гонки</h3><div class="seg">${[25,35,50,100].map(x=>`<button${S.pct==x?' class="on"':''} onclick="S.pct=${x};r1()">${x}% · ${Math.max(3,Math.round(T[S.tr][2]*x/100))} кр.</button>`).join('')}</div></div>
<div class="card"><h3>Пит-стопы: ${lab(c)}</h3><div class="seg">${[0,1,2,3].map(x=>`<button${n==x?' class="on"':''} onclick="stops(${x})">${x}</button>`).join('')}</div>`;
for(let j=0;j<=n;j++){h+=`<div class="g">Стинт ${j+1}</div><div class="seg">${'SMH'.split('').map(m=>`<button${st.c[j]==m?' class="on"':''} onclick="comp(${j},'${m}')">${CP[m].n}</button>`).join('')}</div>`;
if(j<n)h+=sl('Заезд на пит-стоп, круг','pit'+j,p[j],3,N-3,1,'pit').replace('data-k="pit'+j+'"','data-k="'+j+'"')}
h+=`<button class="pr" style="width:100%;margin-top:12px" onclick="autoS()">⚡ Найти оптимальную стратегию</button></div><div id="out"></div>`;$('m').innerHTML=h;out()}
function stops(n){const st=cur().str;while(st.c.length<n+1)st.c.push('H');st.c.length=n+1;st.f=[...Array(n)].map((_,j)=>(j+1)/(n+1));r1()}
function comp(j,m){cur().str.c[j]=m;r1()}
function pit(e){const c=cur(),N=nL(),p=pits(c,N),j=+e.dataset.k,v=cl(+e.value,(j?p[j-1]:0)+3,(j<p.length-1?p[j+1]:N)-3);e.value=v;e.previousElementSibling.textContent=v;c.str.f[j]=v/N;out()}
function autoS(){const c=cur(),tr=T[S.tr],N=nL(),b=base(c,S.tr);let best=null;
for(let n=1;n<=3;n++){const stp=n==3?Math.max(2,Math.round(N/18)):n==2?2:1,cs=[],ps=[];
(function g(a){if(a.length==n+1)return cs.push(a);for(const m of 'SMH')g([...a,m])})([]);
(function g(a,s){if(a.length==n)return ps.push(a);for(let p=s;p<=N-3;p+=stp)g([...a,p],p+4)})([],4);
for(const a of cs){if(new Set(a).size<2)continue;for(const p of ps){const t=race(b,tr,N,a,p,c).t;if(!best||t<best.t)best={t,a,p}}}}
if(best){c.str={c:best.a,f:best.p.map(p=>p/N)};r1()}}

function pitReq(){const c=S.sim.cs.find(q=>q.c===cur());if(c&&!c.pit)c.req=!c.req;draw()}

function draw(){const cv=$('tc');if(!cv||!S.sim)return;const z=S.sim,pf=prof(S.tr),P=path(S.tr),L=pf.Lm,N=P.length,w=cv.width=cv.clientWidth,h=cv.height=Math.max(440,Math.round(w*1.1)),x=cv.getContext('2d'),fg=getComputedStyle(document.body).color,sel=cur(),ord=[...z.cs].sort((a,b)=>b.s-a.s);
if(!pf.ppm){let t=0;P.forEach((q,i)=>{const b=P[(i+1)%N];t+=Math.hypot(b[0]-q[0],b[1]-q[1])});pf.ppm=t/L;const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);pf.bb=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
const[bx,by,ex,ey]=pf.bb,fit=Math.min((w-30)/(ex-bx),(h-30)/(ey-by)),fc=z.cs.find(q=>q.c===sel)||z.cs[0];
const at=s=>{const k=kAt(pf,s),b=P[(k+1)%N],t=Math.min(1,Math.max(0,(((s%L)+L)%L-pf.D[k])/pf.ds[k]));return[P[k][0]+(b[0]-P[k][0])*t,P[k][1]+(b[1]-P[k][1])*t,Math.atan2(b[1]-P[k][1],b[0]-P[k][0])]};
let tx,ty,ts;if(S.cam){const f=at(fc.s);tx=f[0];ty=f[1];ts=w/240/pf.ppm}else{tx=(bx+ex)/2;ty=(by+ey)/2;ts=fit}
S.kx=S.kx==null?tx:S.kx+(tx-S.kx)*.3;S.ky=S.kx==null?ty:S.ky==null?ty:S.ky+(ty-S.ky)*.3;S.ks=S.ks==null?ts:S.ks+(ts-S.ks)*.3;
const sc=S.ks,pt=q=>[w/2+(q[0]-S.kx)*sc,h/2+(q[1]-S.ky)*sc],pm=sc*pf.ppm,rw=Math.max(14,Math.min(50,14*pm*1.4)),po=(s,m)=>{const f=at(s),a=pt(f);return[a[0]-Math.sin(f[2])*m*pm,a[1]+Math.cos(f[2])*m*pm,f[2]]};
const ln=a=>{x.beginPath();a.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]))},sm=v=>{v=cl(v,0,1);return v*v*(3-2*v)};
x.fillStyle='#2f6b3a';x.fillRect(0,0,w,h);x.lineJoin='round';x.lineCap='butt';
const tr=()=>{ln(P.map(pt));x.closePath()};
x.strokeStyle='#e8e8e8';x.lineWidth=rw+9;tr();x.stroke();x.strokeStyle='#d32f2f';x.setLineDash([10,10]);tr();x.stroke();x.setLineDash([]);
x.strokeStyle='#3b3f45';x.lineWidth=rw;tr();x.stroke();
x.strokeStyle='#2e9e4f';x.lineWidth=Math.max(2,rw*.12);for(let k=0;k<N;k++)if(pf.dr[k]){const a=pt(P[k]),b=pt(P[(k+1)%N]);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()}
// питлейн
const pl=[];for(let s=L-350;s<=L+430;s+=10)pl.push(po(s,22*sm((s-(L-350))/60)*sm((L+430-s)/60)));
x.strokeStyle='#e8e8e8';x.lineWidth=Math.max(7,11*pm)+3;ln(pl);x.stroke();x.strokeStyle='#555a63';x.lineWidth=Math.max(7,11*pm);ln(pl);x.stroke();
const bl=Math.max(6,16*pm),bw=Math.max(5,8*pm);SER[sel.s].t.forEach((t,i)=>{const p=po(L+30+i*20,31);x.save();x.translate(p[0],p[1]);x.rotate(p[2]);x.fillStyle=t[t.length-1];x.fillRect(-bl/2,-bw/2,bl,bw);x.strokeStyle='#fff';x.lineWidth=1;x.strokeRect(-bl/2,-bw/2,bl,bw);x.restore()});
x.font='bold 10px system-ui';x.textAlign='center';[['PIT IN',L-350],['PIT OUT',L+430]].forEach(q=>{const p=po(q[1],36);x.lineWidth=3;x.strokeStyle='#000';x.strokeText(q[0],p[0],p[1]);x.fillStyle='#fff';x.fillText(q[0],p[0],p[1])});
// линии: реальная (бледная) и оптимальная
const rl=f=>{const a=[];for(let k=0;k<N;k+=2)a.push(po(pf.D[k],pf.off[k]*6*f));a.push(a[0]);ln(a);x.stroke()};
x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=2;rl(.55);x.strokeStyle='#ffe600';x.lineWidth=2.5;rl(1);
const mk=(d,c)=>{const f=at(d),a=pt(f),nx=-Math.sin(f[2]),ny=Math.cos(f[2]),r=rw/2+5;x.strokeStyle=c;x.lineWidth=4;x.beginPath();x.moveTo(a[0]+nx*r,a[1]+ny*r);x.lineTo(a[0]-nx*r,a[1]-ny*r);x.stroke()};
mk(0,'#fff');mk(L/3,'#ffd600');mk(2*L/3,'#2979ff');
const car=(px,py,an,co,big)=>{x.save();x.translate(px,py);x.rotate(an);const k=big?1.3:1;x.scale(k,k);x.fillStyle='#111';[[-9,-6.3],[-9,3.6],[4,-6.3],[4,3.6]].forEach(q=>x.fillRect(q[0],q[1],5.5,2.7));
x.fillStyle=co;x.fillRect(-13,-5.5,3,11);x.fillRect(10.5,-5.5,3,11);x.beginPath();x.moveTo(-11,-2.8);x.lineTo(3,-3.4);x.lineTo(11,-1);x.lineTo(11,1);x.lineTo(3,3.4);x.lineTo(-11,2.8);x.closePath();x.fill();x.strokeStyle='#000';x.lineWidth=.8;x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(-1,0,1.9,0,6.283);x.fill();x.restore()};
const latOf=c=>{const k=kAt(pf,c.s);let m=pf.off[k]*6*c.lw;if(c.s<150)m+=(c.c.grid%2?1:-1)*6*cl(1-c.s/150,0,1);if(c.pit){const b=sm(cl((c.s-c.ei)/60,0,1)*cl((c.ex-c.s)/60,0,1));m=m*(1-b)+22*b}return m};
for(const c of z.cs.slice().sort((a,b)=>(a.c===sel)-(b.c===sel))){const a=po(c.s,latOf(c)),isS=c.c===sel;
if(isS){x.strokeStyle=fg;x.lineWidth=2;x.beginPath();x.arc(a[0],a[1],21,0,6.283);x.stroke()}
car(a[0],a[1],a[2],col(c.c),isS);x.font='bold 11px system-ui';const t2=(ord.indexOf(c)+1)+' '+SER[c.c.s].t[c.c.t][0].slice(0,3).toUpperCase();x.lineWidth=3;x.strokeStyle='#000';x.strokeText(t2,a[0],a[1]-17);x.fillStyle='#fff';x.fillText(t2,a[0],a[1]-17)}
x.textAlign='start';
if(S.cam){const mw=112,mh=92,m0=w-mw-8,mm=Math.min((mw-12)/(ex-bx),(mh-12)/(ey-by)),q=p=>[m0+6+(p[0]-bx)*mm,14+(p[1]-by)*mm];x.fillStyle='rgba(0,0,0,.6)';x.fillRect(m0,8,mw,mh);x.strokeStyle='#ddd';x.lineWidth=2;ln(P.map(q));x.closePath();x.stroke();z.cs.forEach(c=>{const a=q(at(c.s));x.fillStyle=col(c.c);x.beginPath();x.arc(a[0],a[1],c.c===sel?4.5:3,0,6.283);x.fill()})}
$('lv').innerHTML=ord.map((c,r)=>`<tr${c.c===sel?' style="font-weight:700"':''}><td>${r+1}</td><td><span style="color:${col(c.c)}">●</span> ${lab(c.c)}${c.pit?' 🅿':''}${c.dr?' <b style="color:#2e9e4f">DRS</b>':''}</td><td>${r?'+'+((ord[0].s-c.s)/L*c.lt0).toFixed(1):'—'}</td><td>${r?'+'+((ord[r-1].s-c.s)/L*c.lt0).toFixed(2):'—'}</td><td>${Math.round(c.v)}</td><td><b style="color:${CP[c.comp].c};text-shadow:0 0 1px #000">${c.comp}</b> ${c.wr}%</td><td>${Math.max(0,c.lp)}</td></tr>`).join('');
$('lg').innerHTML=z.log.map(s=>'🔁 '+s).join('<br>');
const c=z.cs.find(q=>q.c===sel);if(!c)return;const r=ord.indexOf(c);
$('tgp').innerHTML=r?`<b>P${r+1}</b> · отставание от ${lab(ord[r-1].c)}: <b>+${((ord[r-1].s-c.s)/L*c.lt0).toFixed(3)} с</b>`:`<b>P1 · лидер</b>${ord[1]?` · интервал до ${lab(ord[1].c)}: <b>+${((c.s-ord[1].s)/L*c.lt0).toFixed(3)} с</b>`:''}`;
const pt2=z.t-c.pin;$('tpt').innerHTML=c.pit===1?`🅿 Питлейн (лимит 80 км/ч): <b>${pt2.toFixed(2)} с</b>`:c.pit===2?`🛠 Стоянка в боксах: <b>${c.stC.toFixed(2)} с</b> · питлейн ${pt2.toFixed(2)} с`:c.pit===3?`Выезд из боксов · питлейн <b>${pt2.toFixed(2)} с</b>`:`Последний пит-стоп: питлейн <b>${c.pl?c.pl.toFixed(2):'—'} с</b> · стоянка <b>${c.stT?c.stT.toFixed(2):'—'} с</b>${c.req?' · заявка на заезд ✔':''}`;
$('tsp').textContent=Math.round(c.v);$('tgr').textContent=c.s<0&&c.v<3?'N':c.gr;$('tdr').textContent=c.dr?'· DRS':'';$('tth').textContent=Math.round(c.th);$('bth').style.width=c.th+'%';$('tbr').textContent=Math.round(c.br);$('bbr').style.width=c.br+'%';
if($('ter')){$('ter').textContent=Math.round(c.er);$('ber').style.width=c.er+'%';$('tdp').textContent=c.dp?'· деплой':''}
$('tty').textContent=`${CP[c.comp].n} · износ ${c.wr}% · ${c.age.toFixed(1)} кр.`;$('bty').style.width=c.wr+'%';$('bty').style.background=c.wr<60?'#2e7d32':c.wr<85?'#ef8f00':'#c62828';
const c3=[0,1,2].map(j=>j<c.sec?c.sc[j]:j==c.sec?z.t-c.st:0);
$('tsc').innerHTML=`Круг ${Math.max(0,c.lp)}: <b>${c.lp>0?fmt(z.t-c.ts):'—'}</b><br>Сейчас: С1 ${sf(c3[0])} · С2 ${sf(c3[1])} · С3 ${sf(c3[2])}<br>Прошлый: С1 ${sf(c.ls[0])} · С2 ${sf(c.ls[1])} · С3 ${sf(c.ls[2])} · круг ${c.last?fmt(c.last):'—'}<br>Лучший круг: ${c.best?fmt(c.best):'—'}`;
const sp=$('sp'),sw=sp.width=sp.clientWidth,sh=sp.height=100,y=sp.getContext('2d'),vm=pf.vt*1.05;
y.strokeStyle=fg;y.lineWidth=2;y.beginPath();for(let k=0;k<pf.n;k+=2){const X=pf.D[k]/L*sw,Y=sh-4-pf.u[k]*3.6*c.m/vm*(sh-8);k?y.lineTo(X,Y):y.moveTo(X,Y)}y.stroke();

const cp=((c.s%L+L)%L)/L*sw;y.strokeStyle='#e10600';y.beginPath();y.moveTo(cp,0);y.lineTo(cp,sh);y.stroke();y.fillStyle='#e10600';y.beginPath();y.arc(cp,sh-4-c.v/vm*(sh-8),4,0,6.283);y.fill()}
